ed by ______ quantum number.", ["azimuthal", "principal", "magnetic", "spin"], "C", "The magnetic quantum number (mₗ) gives the orbital's orientation in space."], ["Which shell has the lowest energy in an atom?", ["K", "L", "M", "N"], "A", "The K shell (n = 1) is closest to the nucleus and lowest in energy."], ["Magnetic quantum number governs the ____ of orbital.", ["Energy and size", "Magnetic moment", "Shape", "Orientation in space"], "D", "mₗ governs the orientation of the orbital in space."], ["The number of electrons in the outermost shell of an atom represents _____", ["Block", "Group", "Period", "Size"], "B", "The number of valence electrons gives the group (for main-group elements)."], ["According to Moseley’s modern periodic law, the properties of elements are periodic functions of their ____", ["Atomic radii", "Atomic weights", "Atomic size", "Atomic number"], "D", "Moseley: properties are a periodic function of atomic number."], ["Which of the following is an example of Döbereiner’s triad?", ["Ne, Ar, Kr", "C, N, O", "Li, Na, K", "B, Al, Ga"], "C", "Li, Na, K: Na's atomic mass (23) is about the average of Li (7) and K (39)."], ["Which of the following alkali metals reacts with nitrogen?", ["Lithium", "Sodium", "Potassium", "Rubidium"], "A", "Lithium is the only alkali metal that reacts directly with nitrogen (forming Li₃N)."], ["Which of the following statements is not correct? (I) Group IA elements are more reactive than Group IIA and Group IVA elements. (II) Beryllium oxide and hydroxide are amphoteric. (III) The reactivity of Group IIA metals decreases down the group. (IV) The ionisation energy of Group IVA elements is less than that of Group IIA.", ["I and II", "II and III", "I and IV", "III and IV"], "D", "III is false (Group 2 reactivity increases down the group). IV is false (Group 14 IE is higher than Group 2)."], ["Electronic configuration of chromium atom:", ["[Ar] 3d² 4s²", "[Ar] 3d⁴ 4s¹", "[Ar] 3d⁴ 4s²", "[Ar] 3d⁵ 4s¹"], "D", "Cr: [Ar] 3d⁵ 4s on: OH attaches to:", ["Carbon with fewer hydrogens (anti-Markovnikov)", "Carbon with more hydrogens (Markovnikov)", "Either carbon", "Terminal carbon only"], "B", "In hydroboration–oxidation, OH ends up on the carbon with more hydrogens (the less substituted one), giving the anti-Markovnikov product."], ["Primary aliphatic amine + nitrous acid at 0–5 °C yields:", ["Quaternary ammonium salt", "No reaction", "Nitrosamine", "Alcohol + N₂"], "D", "Primary aliphatic diazonium salts are unstable and decompose to an alcohol and N₂ gas."], ["Factor reducing basicity of tertiary amine in water:", ["Electron-donating groups", "Steric hindrance preventing solvation", "Lone pair on N", "Reaction with acids"], "B", "Bulky groups around N in tertiary amines hinder solvation of the cation, lowering basicity in water."], ["Adding –OCH₃ at para position of aniline:", ["Increase basicity", "Decrease basicity", "Prevent salts", "Make insoluble"], "A", "–OCH₃ donates electrons by resonance, increasing electron density on N: more basic."], ["Pentyl magnesium bromide + methanal → alcohol:", ["1°", "2°", "3°", "4°"], "A", "Grignard + methanal → primary alcohol (hexan-1-ol)."], ["Grignard + ketone → hydrolysis produces:", ["Primary alcohol", "Secondary alcohol", "Tertiary alcohol", "Carboxylic acid"], "C", "Grignard + ketone, then hydrolysis → tertiary alcohol."], ["Reduction of carboxylic acids with LiAlH₄ yields:", ["Aldehydes", "Ketones", "Primary alcohols", "Secondary alcohols"], "C", "LiAlH₄ reduces carboxylic acids to primary alcohols."], ["Alcohol class dehydrates most easily:", ["Primary", "Secondary", "Tertiary", "All same"], "C", "Tertiary alcohols dehydrate most easily (most stable carbocation)."], ["Propanone + methyl magnesium bromide → hydrolysis yields:", ["Propan-1-ol", "Propan-2-ol", "2-Methylpropan-2-ol", "Butan-2-ol"], "C", "(CH₃)₂C=O + CH₃MgBr → (CH₃)₃C–OH: 2-methylpropan-2-ol."], ["Oxidation of 4-methyl-1-pentanol with acidified sodium chromate:", ["4-methyl-pentanal" nd spinal cord only", "Supplies the skin and muscles and is involved in conscious activities", "Is divided into sympathetic and parasympathetic divisions", "Contains only afferent fibres"], "C", "The somatic system supplies skin and skeletal muscle and is involved in conscious activity."], ["If a neuron is destroyed it cannot be replaced, because neurons are:", ["Non-conductive", "Without a nucleus", "Amitotic (they do not undergo mitosis)", "Capable of rapid mitosis", "Always myelinated"], "C", "Mature neurons are amitotic, so they cannot divide to replace lost cells."], ["Which statement about the processes of a neuron is correct?", ["Dendrites carry impulses away from the cell body, whereas axons carry them toward it", "Each neuron has several axons but only one dendrite", "Axons are always short and highly branched", "Dendrites are always myelinated", "Dendrites carry impulses toward the cell body, whereas the single axon carries impulses away from it"], "E", "Dendrites carry impulses toward the cell body; the single axon carries them away."], ["In the central nervous system, the myelin sheath is produced by:", ["Schwann cells", "Oligodendrocytes", "Interneurons", "Pinealocytes", "Parafollicular cells"], "B", "Oligodendrocytes myelinate CNS axons; Schwann cells do this in the PNS."], ["In the structure of a nerve, each bundle of nerve fibres (fasciculus) is surrounded by the:", ["Perineurium", "Epineurium", "Endoneurium", "Dura mater", "Pia mater"], "A", "The perineurium wraps each fascicle; the epineurium wraps the whole nerve."], ["How many pairs of cranial nerves emerge from the inferior surface of the brain, and which one of them does NOT pass through foramina of the skull?", ["Twelve pairs; the optic nerve", "Ten pairs; the vagus nerve", "Twelve pairs; the vagus nerve", "Thirty-one pairs; the vagus nerve", "Twelve pairs; the olfactory nerve"], "C", "There are 12 pairs of cranial nerves. The answer key gives the vagus as the one that does not pass through skull foramina."], ["Which cranial nerve controls the muscles of the tongue?", ["Glossopharyngeal nerve (IX)", "Facial nerve (VII)", "Hypoglossal nerve (XII)", "Vagus nerve (X)", "Spinal accessory nerve (XI)"], "C", "The hypoglossal nerve (XII) is the motor nerve of the tongue."], ["Taste from the anterior two-thirds of the tongue is carried by the:", ["Glossopharyngeal nerve (IX)", "Trigeminal nerve (V)", "Hypoglossal nerve (XII)", "Facial nerve (VII)", "Vestibulocochlear nerve (VIII)"], "D", "The facial nerve (VII) carries taste from the anterior two-thirds of the tongue."], ["The spinal nerves comprise 31 pairs. How many pairs of thoracic nerves are there?", ["1", "5", "8", "12", "31"], "D", "31 pairs: 8 cervical, 12 thoracic, 5 lumbar, 5 sacral, 1 coccygeal."], ["The cell bodies of the sensory neurons of a spinal nerve are located in the:", ["Ventral root", "Gray matter of the spinal cord", "Dorsal root ganglion", "Cauda equina", "Epineurium"], "C", "Sensory neuron cell bodies sit in the dorsal root ganglion."], ["The sympathetic and parasympathetic divisions of the autonomic nervous system generally:", ["Supply only skeletal muscles", "Have antagonistic effects on the same visceral organs, which helps maintain homeostasis", "Act in the same direction so that both stimulate every organ", "Form part of the central nervous system", "Carry only sensory impulses to the brain"], "B", "The two divisions usually have opposite effects on the same organ, balancing each other."], ["Neurons located entirely within the CNS, forming the connecting link between afferent and efferent neurons, are the:", ["Afferent neurons", "Efferent neurons", "Interneurons (association neurons)", "Neuroglia", "Pinealocytes"], "C", "Interneurons lie wholly in the CNS, linking sensory and motor neurons."], ["Compared with the nervous system, the effects of the endocrine system are generally:", ["Faster, shorter (seconds) and more localised", "Restricted to muscle contraction", "Produced only by electrical impulses", "Slower, longer-lasting (minutes, hours or weeks) and more generalised", "Limited to the digestive tract"], "D", "Hormonal effects are slower, last longer and are more widespread than nervous effects."], ["Exocrine glands differ from endocrine glands in that exocrine glands:", ["Are ductless", "Secrete hormones directly into the blood", "Have ducts that carry their secretions to a surface", "Secrete only steroids", "Include the pituitary and thyroid glands"], "C", "Exocrine glands release secretions through ducts onto a surface."], ["All hormones in the human body are proteins or protein derivatives, except:", ["Insulin and glucagon", "Thyroxine and calcitonin", "The sex hormones and those of the adrenal cortex", "Growth hormone and prolactin", "Antidiuretic hormone and oxytocin"], "C", "Sex hormones and adrenal-cortex hormones are steroids, not proteins."], ["Steroid hormones react with receptor sites:", ["Inside the target cell, producing a relatively slow effect", "On the cell surface, producing a relatively rapid effect", "On the cell surface, producing a relatively slow effect", "Inside the cell, producing a relatively rapid effect", "Only in the blood plasma"], "A", "Steroids cross the membrane and bind receptors inside the cell, acting relatively slowly via gene expression."], ["Hormones that cause the secretion of other hormones are called:", ["Tropic hormones", "Steroid hormones", "Neurotransmitters", "Exocrine secretions", "Antagonistic hormones"], "A", "Tropic hormones stimulate other endocrine glands to secrete."], ["Human chorionic gonadotropin, which signals the mother's ovaries to maintain the uterine lining, is secreted by the:", ["Pineal gland", "Thymus", "Anterior pituitary", "Placenta", "Stomach"], "D", "hCG is secreted by the placenta."], ["The pituitary gland rests in the sella turcica of the sphenoid bone and is connected to the hypothalamus by a slender stalk called the:", ["Isthmus", "Corpus callosum", "Cauda equina", "Cerebellar peduncle", "Infundibulum"], "E", "The infundibulum is the stalk joining the pituitary to the hypothalamus."], ["The adenohypophysis is controlled by ___, whereas the neurohypophysis is controlled by ___.", ["Releasing hormones from the hypothalamus; nerve stimulation", "Nerve stimulation; releasing hormones from the hypothalamus", "Thyroxine; adrenocorticotropic hormone", "Insulin; glucagon", "Melatonin; aldosterone"], "A", "The anterior pituitary responds to hypothalamic releasing hormones; the posterior pituitary to nerve signals."], ["A child with too little growth hormone becomes a:", ["Pituitary dwarf", "Giant (exceptionally tall)", "Person with simple goitre", "Person with hypoparathyroidism", "Person who reaches puberty prematurely"], "A", "Too little growth hormone in childhood causes pituitary dwarfism."], ["Adrenocorticotropic hormone stimulates the secretion of cortical hormones, particularly cortisol, by the:", ["Adrenal medulla", "Thyroid gland", "Adrenal cortex", "Parathyroid glands", "Pancreatic islets"], "C", "ACTH stimulates the adrenal cortex to secrete cortisol."], ["Which hormone promotes reabsorption of water by the kidney tubules, so that less water is lost as urine?", ["Antidiuretic hormone", "Oxytocin", "Prolactin", "Calcitonin", "Glucagon"], "A", "Antidiuretic hormone (ADH) increases water reabsorption in the kidney."], ["Oxytocin:", ["Causes contraction of uterine smooth muscle and ejection of milk from the lactating breast", "Promotes milk production after birth of the infant", "Promotes reabsorption of water in the kidney tubules", "Lowers the level of calcium in the blood", "Stimulates the thyroid gland to secrete thyroxine"], "A", "Oxytocin contracts the uterus during birth and causes milk let-down."], ["Thyroxine and triiodothyronine both require ___ for their synthesis; a deficiency of it causes simple goitre.", ["Calcium", "Iodine", "Sodium", "Iron", "Potassium"], "B", "Thyroid hormones contain iodine; iodine deficiency causes simple goitre."], ["Calcitonin, secreted by the parafollicular cells of the thyroid gland:", ["Raises the calcium level of the blood", "Lowers the blood glucose level", "Conserves sodium ions and water", "Lowers the calcium level of the blood", "Stimulates the ejection of milk"], "D", "Calcitonin lowers blood calcium."], ["Hypoparathyroidism (insufficient parathyroid hormone) leads to increased nerve excitability because:", ["High blood calcium blocks nerve impulses", "Excess thyroxine accelerates metabolism", "Low blood glucose stimulates the nerves", "Low blood sodium paralyses the muscles", "Low blood calcium triggers spontaneous, continuous nerve impulses that stimulate muscle contraction"], "E", "Low blood calcium makes nerves fire spontaneously, causing tetany."], ["Aldosterone, the principal mineralocorticoid secreted by the outermost region of the adrenal cortex, functions to:", ["Increase blood glucose levels", "Conserve sodium ions and water in the body", "Increase heart rate during stress", "Lower blood calcium", "Stimulate the ejection of milk"], "B", "Aldosterone makes the kidney retain sodium and water."], ["The adrenal medulla secretes epinephrine and norepinephrine in response to:", ["Adrenocorticotropic hormone from the pituitary", "Low blood calcium", "High blood glucose", "Stimulation by sympathetic nerves, particularly during stressful situations", "Thyroid-stimulating hormone"], "D", "The adrenal medulla is stimulated by sympathetic nerves during stress."], ["Beta cells of the pancreatic islets secrete ___ in response to ___ blood glucose.", ["Glucagon; low", "Insulin; low", "Insulin; high", "Glucagon; high", "Cortisol; high"], "C", "Beta cells secrete insulin when blood glucose is high."], ["The principal androgen, testosterone, is responsible for all of the following EXCEPT:", ["Enlargement of the larynx with voice changes", "Growth and distribution of body hair", "Increased skeletal and muscular growth", "Increased male sexual drive", "Thickening of the uterine lining"], "E", "Thickening of the uterine lining is due to oestrogen and progesterone, not testosterone."], ["Which hormone causes the uterine lining to thicken in preparation for pregnancy?", ["Testosterone", "Oxytocin", "Gastrin", "Melatonin", "Progesterone"], "E", "Progesterone prepares and maintains the thickened uterine lining."], ["Which hormone is produced by the stomach lining in response to food and stimulates secretion of hydrochloric acid and pepsin?", ["Secretin", "Gastrin", "Cholecystokinin", "Thymosin", "Atrial natriuretic peptide"], "B", "Gastrin from the stomach lining stimulates HCl and pepsin secretion."]];
const RAW_ZOO102 = [["The basis of animal classification includes differences in forms and functions, True or False?", ["True", "False", "Do not know", "partly true partly false"], "A", "Animals are classified by similarities and differences in body form and function."], ["The following characteristics describe cephalization except………", ["It is the tendency to task nervous tissues to concentrate at the anterior end of the body", "It is the tendency to have a central control of the entire organism", "It is the tendency to have body parts arranged around a central axis with oral and aboral sides", "None of the above"], "C", "Arrangement of parts around a central axis with oral/aboral sides is radial symmetry, not cephalisation."], ["The mesoderm tissue fully lines the fluid-filled cavity called ……………", ["Coelom", "Archentheron", "Pseudocoelom", "Procercoid"], "A", "A true coelom is a fluid-filled cavity fully lined by mesoderm."], ["The Notochord found in chordates serves as ………………..", ["blastopore to become mouth", "primary source of skeletal support", "blastopore to form anus", "back organs"], "B", "The notochord is the primary skeletal support (axial rod) in chordates."], ["….…….. aids the evolution of new body plans and diversification among individuals", ["embryogenesis", "segmentation", "cephalization", "fertilization"], "B", "Segmentation (repeated body units) allows new body plans and specialisation of segments."], ["All animal body evolved from a …………. ancestor", ["Chordate", "Triploblastic", "Protist", "All of the above"], "C", "All animals are thought to have evolved from a colonial protist (choanoflagellate-like) ancestor."], ["An ordered group of taxonomic ranks used to classify organisms from general to specific is ------", ["Cladogram", "Taxonomic hierarchy", "evolutionary tree", "Aristotle classification"], "B", "The taxonomic hierarchy is the ordered set of ranks from general to specific."], ["Which of the following is not true about zoological nomenclature?", ["It is applied to only living taxa", "It should be unique", "It should be universally accepted", "It should be stable"], "A", "Zoological names are applied to extinct as well as living taxa, so A is not true."], ["The following kingdoms are included in Eukaryota except -------------------", ["Prokaryotae", "Animalia", "Plantae", "Protista"], "A", "Prokaryotes (Monera) are not eukaryotes."], ["------------ is made up of closely related orders", ["Family", "Kingdom", "Class", "Phylum"], "C", "A class is a group of related orders."], ["A species' scientific name has ----- parts which together uniquely identify it", ["Three", "Four", "Two", "Five"], "C", "Binomial nomenclature: genus + species, two parts."], ["Square brackets are used in taxonomy to indicate special cases such as", ["The transfer of species from one genus to the other", "Original authorship", "Death of author", "To flag misidentification"], "D", "The answer key gives D. A species moved to another genus is shown with the author in round brackets, not square brackets."], ["In cladistics type of classification only -------------- groups are considered", ["Polyphyletic", "Monophyletic", "Paraphyletic", "Multiphyletic"], "B", "Cladistics recognises only monophyletic groups (clades)."], ["There is no regard to phylogeny in -----------", ["Cladistics", "Phenetic", "Molecular systematics", "Systematics"], "B", "Phenetics groups organisms by overall similarity, ignoring phylogeny."], ["------------- are different scientific names of the same rank that pertain to the same taxon", ["Synonyms", "Homonyms", "Harmony", "Synchrony"], "A", "Synonyms are different names for the same taxon."], ["A ------------------is the highest rank of organisms", ["Kingdom", "Phylum", "domain", "order"], "C", "The domain is the highest rank (Bacteria, Archaea, Eukarya)."], ["Animals have two unique cell types: nerve cells for ……………… and muscle cells for ……............", ["impulse conduction and movement", "feeding and running", "gliding and coordination", "none of the above"], "A", "Nerve cells conduct impulses; muscle cells produce movement."], ["Vertebrates moved to land about…………. years ago and diversified into many lineages", ["300 million", "360 million", "340 million", "250 million"], "B", "Vertebrates came onto land about 360 million years ago (Devonian)."], ["Mesozoic Era is between ……………. million years ago", ["65.5 to present", "542-251", "251-65.5", "250-65.4"], "C", "The Mesozoic Era ran from about 251 to 65.5 million years ago."], ["Insects and flowering plants both underwent a dramatic diversification during the………..era", ["Mesozoic", "Cenozoic", "Paleozoic", "Cambrian"], "B", "Insects and flowering plants diversified dramatically in the Cenozoic (the key's answer)."], ["Scientist divided the Animal Kingdom into ………… main groups", ["4", "3", "5", "2"], "D", "The animal kingdom is divided into two main groups: invertebrates and vertebrates."], ["Which of the 3 germ layers give rise to the supporting cells?", ["Endoderm", "Ectoderm", "Mesoderm", "Pseudocoelom"], "C", "Mesoderm forms supporting tissues: muscle, bone and connective tissue."], ["In terms of body cavity, Nematodes and Rotifers are examples of …………….organisms", ["Pseudocoelomates", "Acoelomates", "Eucoelomates", "Schizocoelom"], "A", "Nematodes and rotifers have a pseudocoelom."], ["All these are examples of Schizocoelom except………….", ["Annelida", "Mollusca", "Arthropoda", "Platyhelminths"], "D", "Flatworms are acoelomate, so they have no schizocoelom."], ["Complete digestive system is found in all these organisms except", ["Coelenterates", "Chordates", "Nematodes", "Annelids"], "A", "Coelenterates (cnidarians) have a single opening, so their gut is incomplete."], ["When minute amounts of yolk which are evenly distributed within the cytoplasm are found in an egg, it is termed ……………. eggs", ["Telolecithal", "Isolecithal", "Centrolecithal", "Mesolecithal"], "B", "Isolecithal eggs have little yolk spread evenly."], ["One of these is not a major type of cell movement", ["Ingression", "Invagination", "Involution", "Abrassion"], "D", "“Abrassion” is not a gastrulation movement; ingression, invagination and involution are."], ["A sheet of cells spreading by thinning is termed…………..", ["Invagination", "Epiboly", "Ingression", "Abrassion"], "B", "Epiboly is the spreading and thinning of a cell sheet."], ["The body plan in which similar body parts are arranged around a central axis is called ________", ["Bilateral symmetry", "Asymmetry", "Radial symmetry", "Segmentation"], "C", "Parts arranged around a central axis is radial symmetry."], ["In which type of animals is the body cavity formed between the body wall and gut wall?", ["Acoelomates", "Pseudocoelomates", "Coelomates", "Diploblastic"], "B", "The answer key gives pseudocoelomates."], ["Animals that have cells but no true tissues belong to ______________", ["Porifera", "Cnidaria", "Platyhelminthes", "Annelida"], "A", "Sponges (Porifera) are at the cellular level, with no true tissues."], ["The level of organization in Platyhelminthes is __________________", ["Cellular level", "Tissue level", "Organ level", "Organ-system level"], "C", "Flatworms show organ-level organisation."], ["The main advantage of multicellularity is ___________________", ["ability to photosynthesize", "division of labour among cells", "reduction in cell size", "faster reproduction"], "B", "Multicellularity allows division of labour among specialised cells."], ["Multicellularity allows animals to develop _________________", ["tissues and organs", "only one type of cell", "no coordination system", "no specialization"], "A", "Multicellularity allows tissues and organs to develop."], ["Specialized cells performing specific functions in multicellular animals is called ________________", ["symbiosis", "differentiated cells", "mutation", "fusion"], "B", "Cells specialised for particular jobs are differentiated cells."], ["The coordination among different types of cells in multicellular organisms is maintained by _______", ["circulatory and nervous systems", "random processes", "mutation", "controlled growth"], "A", "Circulatory and nervous systems coordinate the different cells."], ["Which of the following statements is true about multicellular animals?", ["All cells are identical in structure and function", "Each cell performs all life functions independently", "Different cells are specialized for different functions", "They lack communication between cells"], "C", "In multicellular animals, different cells are specialised for different functions."], ["In multicellular organisms, growth occurs by ______", ["increase in cell size only", "increase in the number of cells", "fusion of cell", "miotic division"], "B", "Multicellular organisms grow mainly by increasing their number of cells."], ["Which organization works globally for the conservation of biodiversity?", ["WHO", "WTO", "WWF", "UNDP"], "C", "WWF (World Wide Fund for Nature) works globally on biodiversity conservation."], ["Which of these is an example of in-situ conservation?", ["ZOO garden", "Botanical garden", "Gene bank", "National park"], "D", "A national park protects species in their natural habitat: in-situ conservation."], ["Which set of characteristics defines the kingdom Animalia (Metazoa)?", ["Multicellular, ingestive, heterotrophic eukaryotes whose cells lack cell walls", "Unicellular, photosynthetic prokaryotes with cell walls", "Multicellular autotrophs with cell walls for support", "Unicellular heterotrophic prokaryotes without a nucleus", "Multicellular, photosynthetic eukaryotes with cellulose walls"], "A", "Animals are multicellular, heterotrophic (ingestive) eukaryotes with no cell walls."], ["Because animal cells lack cell walls, animal bodies are held together by extracellular structural proteins, especially:", ["Collagen", "Chitin", "Cellulose", "Mesoglea", "Haemoglobin"], "A", "Collagen is the main structural protein of animal extracellular matrix."], ["Which statement about the vertebrate classes is correct?", ["Amphibians have dry, scaly skin and lay eggs on dry land", "Fishes are warm-blooded and have fur", "Birds have moist, slimy skin and gills", "Reptiles have dry, scaly skin and lay eggs on dry land", "Mammals lay hard-shelled eggs and have feathers"], "D", "Reptiles have dry, scaly skin and lay shelled eggs on land."], ["Which group of arthropods has eight legs, two body parts and no antennae?", ["Insects", "Crustaceans", "Arachnids", "Myriapods", "Annelids"], "C", "Arachnids: 8 legs, 2 body parts (cephalothorax and abdomen), no antennae."], ["The oldest generally accepted animal fossils, about 575 million years old, are the:", ["Cambrian hard-skeleton fossils", "Mesozoic dinosaurs", "Silurian fishes", "Ediacara fauna", "Cenozoic grassland apes"], "D", "The Ediacara fauna (~575 million years) are the oldest accepted animal fossils."], ["Which sequence lists the eras from oldest to youngest?", ["Paleozoic, Neoproterozoic, Mesozoic, Cenozoic", "Neoproterozoic, Paleozoic, Mesozoic, Cenozoic", "Neoproterozoic, Mesozoic, Paleozoic, Cenozoic", "Cenozoic, Mesozoic, Paleozoic, Neoproterozoic", "Paleozoic, Mesozoic, Neoproterozoic, Cenozoic"], "B", "Oldest to youngest: Neoproterozoic, Paleozoic, Mesozoic, Cenozoic."], ["Which of the following is suggested as having preceded and encouraged the Cambrian explosion?", ["A fall in atmospheric oxygen", "The disappearance of all predators", "A rise in atmospheric oxygen and new predator–prey relationships", "The extinction of the dinosaurs", "The evolution of flowering plants"], "C", "Rising atmospheric oxygen and new predator–prey interactions likely drove the Cambrian explosion."], ["The International Code of Zoological Nomenclature (ICZN) adopts which system of naming animals?", ["A numerical coding system", "A symbol-based system", "A local common-name system", "The binomial system", "A phenetic coding system"], "D", "The ICZN uses binomial nomenclature."],  "Transitions of authority after the leader's demise are often unstable", "It relies too heavily on written rules", "It cannot inspire rapid change"], "B", "The notes give B: Transitions of authority after the leader's demise are often unstable."], ["Which of the following best distinguishes legitimacy from legality?", ["Legitimacy means acceptance of rule, while legality means accordance with law", "They are entirely synonymous terms", "Legitimacy only concerns religious rulers", "Legality applies only to democracies"], "A", "The notes give A: Legitimacy means acceptance of rule, while legality means accordance with law."], ["The international state system is generally regarded as having been born with which historical treaty?", ["Treaty of Versailles (1919)", "Treaty of Westphalia (1648)", "Treaty of Paris (1783)", "Treaty of Vienna (1815)"], "B", "The notes give B: Treaty of Westphalia (1648)."], ["The Treaty of Westphalia is significant in international relations chiefly because it marked the first formal recognition of:", ["Human rights", "State sovereignty", "Global trade agreements", "Universal citizenship"], "B", "The notes give B: State sovereignty."], ["Max Weber defined the state as a human community that successfully claims a monopoly on the legitimate use of:", ["Taxation", "Physical force within a given territory", "Religious authority", "International diplomacy"], "B", "The notes give B: Physical force within a given territory."], ["Thomas Hobbes was notably among the first to conceptualise the state as:", ["A democratic assembly", "An artificial entity/person separate from the sovereign and the ruled", "A religious institution", "A purely economic organisation"], "B", "The notes give B: An artificial entity/person separate from the sovereign and the ruled."], ["According to the notes, the five essential common features shared by every state include population, territory, sovereignty, and government, along with:", ["A written constitution", "A national currency", "Permanence / a functioning system", "UN membership"], "C", "The notes give C: Permanence / a functioning system."], ["Which of the following is NOT listed among the distinctive features of the state discussed in the notes?", ["Universal jurisdiction", "Legitimate monopoly of violence", "Compulsory jurisdiction", "Freedom of the press"], "D", "The notes give D: Freedom of the press."], ["According to the notes, the five major functions of the state include establishment of order, provision of an economic framework, provision of infrastructure, protecting the environment, and:", ["Promoting a single religion", "Caring for the poor, aged, and persons with disability", "Controlling the media", "Expanding territory through conquest"], "B", "The notes give B: Caring for the poor, aged, and persons with disability."], ["A group of people united by common bonds of race, language, custom, and tradition, but not necessarily possessing their own government, is best described as a:", ["State", "Nation", "Regime", "Confederation"], "B", "The notes give B: Nation."], ["When a nation and a state coincide, such that the people and the political unit share the same identification, the result is called a:", ["City-state", "Nation-state", "Federation", "Protectorate"], "B", "The notes give B: Nation-state."], ["According to the notes, which of the following is cited as an example of a nation without its own independent state?", ["Japan", "Finland", "The Kurds", "France"], "C", "The notes give C: The Kurds."], ["According to the notes, approximately how many sovereign states are members of the United Nations?", ["150", "175", "193", "210"], "C", "The notes give C: 193."], ["According to the notes, the two non-member observer states at the United Nations are the Holy See and:", ["Taiwan", "The State of Palestine", "Kosovo", "Western Sahara"], "B", "The notes give B: The State of Palestine."], ["According to the notes, the continent with the largest number of individual countries is:", ["Asia", "Europe", "Africa", "South America"], "C", "The notes give C: Africa."], ["The Twelve Articles (1525) is generally considered to be:", ["The first record of human rights in Europe", "Nigeria's founding constitution", "A treaty ending World War I", "Part of the UN Charter"], "A", "The notes give A: The first record of human rights in Europe."], ["The Statute of Kalisz (1264) granted protective privileges, including protection from discrimination, to which minority group in the Kingdom of Poland?", ["Protestants", "The Jewish minority", "Roma communities", "Ottoman merchants"], "B", "The notes give B: The Jewish minority."], ["The two 18th-century revolutions credited with producing landmark rights documents were the American Revolution and:", ["The Russian Revolution", "The French Revolution (1789)", "The Industrial Revolution", "The Latin American Wars of Independence"], "B", "The notes give B: The French Revolution (1789)."], ["The foundations of international humanitarian law were laid partly by the 1864 Lieber Code and the first:", ["Geneva Convention", "Hague Convention", "Treaty of Westphalia", "UN Charter"], "A", "The notes give A: Geneva Convention."], ["The League of Nations was established in 1919 following negotiations over the:", ["Treaty of Westphalia", "Treaty of Versailles", "Geneva Convention", "Atlantic Charter"], "B", "The notes give B: Treaty of Versailles."], ["At the 1945 Yalta Conference, the Allied Powers agreed to create a body to replace the League of Nations, which became the:", ["International Court of Justice", "United Nations", "World Health Organization", "European Union"], "B", "The notes give B: United Nations."], ["The Guinness Book of Records describes the Universal Declaration of Human Rights as the:", ["Oldest legal document in the world", "Most Translated Document in the world", "Shortest legal charter in the world", "Least cited legal text in the world"], "B", "The notes give B: Most Translated Document in the world."], ["International Human Rights Day is commemorated annually on:", ["1 January", "10 December", "4 July", "24 October"], "B", "The notes give B: 10 December."], ["According to the categories discussed, which right is classified as a 'Limited Right' rather than an absolute or qualified right?", ["Freedom from torture", "Liberty", "Freedom of expression", "Freedom from slavery"], "B", "The notes give B: Liberty."], ["Which right is classified as a 'Qualified Right', restrictable in circumstances such as a state of emergency?", ["Freedom from slavery", "Freedom from torture", "Freedom of expression", "Freedom from discrimination"], "C", "The notes give C: Freedom of expression."], ["Among the 'seven core freedoms', which specifically concerns living and working without exploitation?", ["Freedom from want", "Freedom for decent work", "Freedom from fear", "Freedom of participation"], "B", "The notes give B: Freedom for decent work."], ["Beyond the domestic courts, an aggrieved party in Nigeria may, according to the notes, ultimately appeal to bodies including the West African Parliament and the:", ["African Union Commission", "International Court of Justice", "World Trade Organization", "UN Security Council"], "B", "The notes give B: International Court of Justice."], ["The human rights conflict between security and privacy is illustrated by tension between which two rights?", ["Life, liberty and security vs. privacy, family, home and correspondence", "Freedom of religion vs. freedom of assembly", "Right to education vs. right to health", "Right to vote vs. right to work"], "A", "The notes give A: Life, liberty and security vs. privacy, family, home and correspondence."], ["R2P was first voiced in 2001, two years after debate over the legality of the:", ["Gulf War", "NATO intervention in the former Yugoslavia (1999)", "Iraq invasion", "Falklands War"], "B", "The notes give B: NATO intervention in the former Yugoslavia (1999)."], ["The idea of R2P emerged partly as a reaction to an initiative by former UN Secretary-General:", ["Ban Ki-moon", "Kofi Annan", "Kurt Waldheim", "Dag Hammarskjöld"], "B", "The notes give B: Kofi Annan."], ["According to R2P's basic principles, the primary responsibility for protecting a population from mass atrocities lies with:", ["The United Nations Security Council", "The state itself", "Neighbouring states", "Non-governmental organisations"], "B", "The notes give B: The state itself."], ["According to the notes, human rights future challenges include asylum for refugees, gender rights, and:", ["LGBT rights", "Trade rights", "Tax rights", "Consumer rights"], "A", "The notes give A: LGBT rights."], ["In ancient Athens, being a citizen entitled a man to vote, hold office, serve on committees and juries, and:", ["Own slaves exclusively", "Render military service", "Avoid taxation entirely", "Marry only fellow citizens"], "B", "The notes give B: Render military service."], ["By around 212 A.D., Roman citizenship had been extended to foreign soldiers serving in the army and to men of:", ["Conquered lands", "The clergy only", "The Senate alone", "Royal families"], "A", "The notes give A: Conquered lands."], ["Under the feudal system, the ultimate figure to whom overlords owed allegiance was the:", ["Pope", "King", "Bishop", "Guild master"], "B", "The notes give B: King."], ["By the 1600s, according to the notes, common people's primary allegiance shifted away from local nobles toward the:", ["Church", "King", "Merchant guilds", "Local militia"], "B", "The notes give B: King."], ["Which of the following is NOT listed among the thinkers associated with the Republican perspective on citizenship?", ["Aristotle", "Machiavelli", "Rousseau", "Hobbes"], "D", "The notes give D: Hobbes."], ["Aristotle's characterisation of citizens as 'those who share in the holding of office' is drawn from his work:", ["Nicomachean Ethics", "Politics", "Rhetoric", "Metaphysics"], "B", "The notes give B: Politics."], ["The Liberal perspective on citizenship is traced back historically to reflections on:", ["Greek city-state democracy", "Roman law and the Roman Empire", "Feudal chivalry", "Islamic jurisprudence"], "B", "The notes give B: Roman law and the Roman Empire."], ["According to the notes, one risk facing a naturalized citizen is that they may lose their new citizenship if they:", ["Marry a foreigner", "Return to their birth country and remain there for a long time", "Change religion", "Move temporarily to a third country"], "B", "The notes give B: Return to their birth country and remain there for a long time."], ["According to the notes, the 1999 Nigerian Constitution does not explicitly define citizenship, but does mention:", ["\"Citizens of the states\"", "\"World citizens\"", "\"Global citizens\"", "\"Naturalized subjects\""], "A", "The notes give A: \"Citizens of the states\"."], ["Among Marshall's key points on citizenship and social class, one effect of the 20th-century expansion of social rights was:", ["A widening of the income gap", "A lessening of the income gap", "Reduced access to education", "Increased class segregation"], "B", "The notes give B: A lessening of the income gap."], ["Thomas Hobbes lived through which major English historical event that shaped his political thought?", ["The Glorious Revolution", "The English Civil War (1642–1648)", "The Napoleonic Wars", "World War I"], "B", "The notes give B: The English Civil War (1642–1648)."], ["Hobbes's Leviathan was published in the year:", ["1620", "1651", "1689", "1762"], "B", "The notes give B: 1651."], ["Robert Filmer's work 'Patriarcha,' which argued that a king's authority came directly from God, was directly refuted by:", ["Thomas Hobbes", "John Locke", "Jean-Jacques Rousseau", "John Rawls"], "B", "The notes give B: John Locke."], ["According to the notes, Hobbes's social contract is composed of two distinguishable agreements: one to renounce individual rights against one another, and a second to:", ["Abolish private property entirely", "Invest an authority with power to enforce the contract", "Create a representative parliament", "Establish universal suffrage"], "B", "The notes give B: Invest an authority with power to enforce the contract."], ["Locke's second treatise on government, laying out his constructive theory of civil government, is titled:", ["Leviathan", "An Essay Concerning the True Original Extent and End of Civil Government", "The Social Contract", "A Theory of Justice"], "B", "The notes give B: An Essay Concerning the True Original Extent and End of Civil Government."], ["According to Locke, once political society is created through consent, individuals gain three things they lacked in the State of Nature — laws, an executive power to enforce them, and:", ["Judges to adjudicate the laws", "Unlimited private wealth", "A hereditary monarchy", "Standing armies"], "A", "The notes give A: Judges to adjudicate the laws."], ["Rousseau's account of humanity's evolution from the State of Nature, commonly called the 'Second Discourse,' is formally titled:", ["The Social Contract", "Discourse on the Origin and Foundations of Inequality Among Men", "Two Treatises of Government", "A Theory of Justice"], "B", "The notes give B: Discourse on the Origin and Foundations of Inequality Among Men."], ["Rousseau's normative social contract theory is set out in his 1762 work titled:", ["Leviathan", "The Social Contract", "Emile", "Confessions"], "B", "The notes give B: The Social Contract."], ["According to Rousseau, individuals must conform to the general will even against private wishes, a condition he famously describes as being:", ["\"Forced to be free\"", "\"Chained to the state\"", "\"Sovereign by nature\"", "\"Liberated by law\""], "A", "The notes give A: \"Forced to be free\"."], ["According to Rousseau, his strong conception of direct democracy would only be feasible in:", ["Very large states with big populations", "Relatively small states", "Federations of multiple nations", "States without any government"], "B", "The notes give B: Relatively small states."], ["In Plato's dialogue 'Republic,' the character who offers a social-contract-style account of justice — that people submit to conventions of justice mainly out of fear of suffering injustice — is:", ["Crito", "Glaucon", "Thrasymachus", "Meno"], "B", "The notes give B: Glaucon."], ["In Rawls's theory, the first of his Two Principles of Justice concerns the distribution of:", ["Economic goods only", "Basic liberties, distributed as widely as possible consistent with equality for all", "Religious privileges", "Military obligations"], "B", "The notes give B: Basic liberties, distributed as widely as possible consistent with equality for all."], ["According to Rawls, the first principle of justice (liberty) takes priority over the second, meaning that:", ["Citizens may trade civil liberties for greater wealth", "Civil liberties cannot be sacrificed for greater economic advantage", "Economic goods are always more important than liberty", "Both principles apply only after a constitution exists"], "B", "The notes give B: Civil liberties cannot be sacrificed for greater economic advantage."], ["According to Locke's explicit consent argument, a person becomes bound to a political community by:", ["Being born within its territory", "Agreeing with others to join and unite into a community for safe, comfortable living", "Paying taxes for at least a decade", "Simply residing there for one year"], "B", "The notes give B: Agreeing with others to join and unite into a community for safe, comfortable living."], ["Locke's concept of 'tacit consent' suggests that a person gives implied consent to a government merely by:", ["Voting in an election", "Possessing or enjoying any part of the government's territory, even by travelling on the highway", "Signing a formal declaration", "Swearing an oath of allegiance"], "B", "The notes give B: Possessing or enjoying any part of the government's territory, even by travelling on the highway."], ["David Hume criticised Locke's idea of tacit consent by arguing that:", ["All citizens freely choose their nationality", "A poor peasant often has no real freedom to leave his country, so his 'consent' is not meaningful", "Consent should always be written", "Tacit consent applies only to monarchies"], "B", "The notes give B: A poor peasant often has no real freedom to leave his country, so his 'consent' is not meaningful."], ["Ronald Dworkin's memorable criticism of hypothetical consent theory was that:", ["A hypothetical contract isn't worth the paper it isn't written on", "Only explicit contracts have moral force", "Consent theories apply only to citizens over 40", "Hypothetical consent is stronger than actual consent"], "A", "The notes give A: A hypothetical contract isn't worth the paper it isn't written on."], ["According to the notes, the principal contemporary arguments for political obligation include consent, gratitude, promise-keeping, fairness, necessary institutions, and:", ["Public good", "Military service", "Wealth accumulation", "Religious duty"], "A", "The notes give A: Public good."], ["The term 'civil disobedience' was coined by Henry David Thoreau in an essay written in the year:", ["1776", "1848", "1919", "1955"], "B", "The notes give B: 1848."], ["Thoreau's refusal to pay a state poll tax was a protest against the American government's prosecution of a war in Mexico and its enforcement of the:", ["Homestead Act", "Fugitive Slave Law", "Alien and Sedition Acts", "Espionage Act"], "B", "The notes give B: Fugitive Slave Law."], ["Martin Luther King Jr., a key figure in the American civil rights movement, was awarded the Nobel Peace Prize in:", ["1955", "1964", "1968", "1972"], "B", "The notes give B: 1964."], ["Rosa Parks helped initiate the American civil rights movement by refusing to give up her bus seat in Montgomery, Alabama, in the year:", ["1948", "1955", "1963", "1968"], "B", "The notes give B: 1955."], ["Which political theorist defined the state, in a 1919 lecture, as a human community claiming a monopoly of the legitimate use of physical force within a given territory?", ["Stephen Krasner", "Max Weber", "D.D. Raphael", "John Hall"], "B", "The notes give B: Max Weber."], ["Which scholar's definitions of the state include viewing it as a government, a public bureaucracy, an institutional legal order, a ruling class, and a normative order?", ["Max Weber", "Stephen Krasner", "Merille Grindle", "D.D. Raphael"], "B", "The notes give B: Stephen Krasner."], ["D.D. Raphael defined the state as an association designed primarily to maintain order and security by exercising:", ["Selective jurisdiction only in emergencies", "Universal jurisdiction within territorial boundaries by law backed by force", "Jurisdiction only over its capital city", "Religious jurisdiction over its citizens"], "B", "The notes give B: Universal jurisdiction within territorial boundaries by law backed by force."], ["According to John Hall's definition, the most important institutions of the state are those concerned with:", ["Education and welfare", "Violence and coercion", "Trade and commerce", "Religion and culture"], "B", "The notes give B: Violence and coercion."], ["Merille Grindle defines the state as a set of ongoing institutions for social control and:", ["Religious observance", "Authoritative decision-making and implementation", "Cultural preservation only", "International diplomacy alone"], "B", "The notes give B: Authoritative decision-making and implementation."], ["According to the notes, the 'distinctive features of the state' include universal jurisdiction, territoriality and its limits, compulsory jurisdiction, and:", ["Legitimate monopoly of violence", "Freedom of the press", "Universal suffrage", "Multiparty democracy"], "A", "The notes give A: Legitimate monopoly of violence."], ["The theory holding that the state evolved gradually from the family through the clan and tribe to a settled community is the ______ theory.", null, "evolutionary", "Complete sentence: The theory holding that the state evolved gradually from the family through the clan and tribe to a settled community is the evolutionary theory.", ["evolutionary"]], ["The Force theory claims that the state originated when the strong ______ the weak.", null, "conquered/dominated", "Complete sentence: The Force theory claims that the state originated when the strong conquered the weak.", ["conquered", "dominated", "subdued"]], ["The Divine Right theory holds that a ruler's authority derives ultimately from ______.", null, "God (or the Gods)", "Complete sentence: The Divine Right theory holds that a ruler's authority derives ultimately from God.", ["god", "gods", "the gods"]], ["The scholar ______ criticised the Divine Right theory as being 'contrary to experience and commonsense.'", null, "Gilchrist", "Complete sentence: The scholar Gilchrist criticised the Divine Right theory as being 'contrary to experience and commonsense.'", ["Gilchrist"]], ["Human rights are described as fundamental rights that belong to a person simply by being a ______.", null, "human being", "Complete sentence: Human rights are described as fundamental rights that belong to a person simply by being a human being.", ["human being", "human"]], ["The three key principles of human rights identified in the notes are universality, equality, and ______.", null, "non-discrimination", "Complete sentence: The three key principles of human rights identified in the notes are universality, equality, and non-discrimination.", ["non-discrimination"]], ["The document that required King John of England to accept limits on his power in 1215 is the ______.", null, "Magna Carta", "Complete sentence: The document that required King John of England to accept limits on his power in 1215 is the Magna Carta.", ["magna carta"]], ["The Universal Declaration of Human Rights was adopted by the United Nations General Assembly in ive on citizenship, associated with Aristotle, emphasises active civic self-rule.", ["Republican"]], ["The ______ perspective on citizenship, associated with Locke, emphasises citizenship as a legal status.", null, "Liberal", "Complete sentence: The Liberal perspective on citizenship, associated with Locke, emphasises citizenship as a legal status.", ["Liberal"]], ["Citizenship acquired through descent from a citizen parent is known as ______.", null, "jus sanguinis", "Complete sentence: Citizenship acquired through descent from a citizen parent is known as jus sanguinis.", ["jus sanguinis"]], ["Citizenship acquired by being born within a state's territory is known as ______.", null, "jus soli", "Complete sentence: Citizenship acquired by being born within a state's territory is known as jus soli.", ["jus soli"]], ["T.H. Marshall emphasised the importance of ______ rights in integrating the working class into British society.", null, "social", "Complete sentence: T.H. Marshall emphasised the importance of social rights in integrating the working class into British society.", ["social"]], ["According to Aristotle's classification, rule by the few in the interest of all is called ______.", null, "aristocracy", "Complete sentence: According to Aristotle's classification, rule by the few in the interest of all is called aristocracy.", ["aristocracy"]], ["According to Aristotle's classification, rule by one person in his own self-interest, rather than the interest of all, is called ______.", null, "tyranny", "Complete sentence: According to Aristotle's classification, rule by one person in his own self-interest, rather than the interest of all, is called tyranny.", ["tyranny"]], ["In Nigeria, the body established to monitor and promote human rights is the National ______ Commission.", null, "Human Rights", "Complete sentence: In Nigeria, the body established to monitor and promote human rights is the National Human Rights Commission.", ["human rights"]], ["The seven core let actx=null;
function tone(seq){
  return; /* sound removed */
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const t0=actx.currentTime;
    seq.forEach(([f,st,dur,type,vol])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type||'sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t0+st); g.gain.linearRampToValueAtTime(vol||.12,t0+st+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+st+dur);
      o.connect(g); g.connect(actx.destination); o.start(t0+st); o.stop(t0+st+dur+.02);
    });
  }catch(e){}
}

const libs={};
function loadScript(src){ return libs[src]||(libs[src]=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.async=true; s.onload=res; s.onerror=()=>{delete libs[src]; rej(new Error('load'));}; document.head.appendChild(s); })); }
async function pdfText(buf,onp){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  const lib=window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await lib.getDocument({data:buf}).promise; const out=[]; let chars=0;
  for(let i=1;i<=doc.numPages;i++){ const pg=await doc.getPage(i); const tc=await pg.getTextContent(); const t=tc.items.map(t=>t.str).join(' '); chars+=t.replace(/\s/g,'').length; out.push('[Slide '+i+'] '+t); onp&&onp(i,doc.numPages); }
  const text=out.join('\n');
  // Scanned or picture slides: very little real text per page, so send page images for the AI to read
  if(chars/doc.numPages<120){
    const n=doc.numPages, pick=n<=20?[...Array(n).keys()].map(i=>i+1):[...Array(20).keys()].map(k=>1+Math.round(k*(n-1)/19));
    const imgs=[]; let total=0;
    for(const [k,i] of pick.entries()){
      const pg=await doc.getPage(i), v0=pg.getViewport({scale:1}), sc=Math.min(2,1000/Math.max(v0.width,v0.height)), v=pg.getViewport({scale:sc});
      const cv=document.createElement('canvas'); cv.width=Math.round(v.width); cv.height=Math.round(v.height);
      const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height);
      await pg.render({canvasContext:cx,viewport:v}).promise;
      let q=0.6, d=cv.toDataURL('image/jpeg',q).split(',')[1];
      while(d.length>380000&&q>0.3){ q-=0.1; d=cv.toDataURL('image/jpeg',q).split(',')[1]; }
      total+=d.length; if(total>7000000) break;
      imgs.push(d); onp&&onp(k+1,pick.length,'photo');
    }
    return {text:chars>40?text:'', images:imgs, scanned:true};
  }
  return {text, images:[]};
}
async function zipXmlText(buf,kind){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const zip=await window.JSZip.loadAsync(buf);
  const pick=kind==='pptx'?Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>(+a.match(/\d+/)[0])-(+b.match(/\d+/)[0])):['word/document.xml'];
  const out=[];
  for(const [i,n] of pick.entries()){
    const f=zip.file(n); if(!f) continue;
    const xml=await f.async('string');
    const t=(xml.match(/<a:t>[^<]*<\/a:t>|<w:t[^>]*>[^<]*<\/w:t>|<\/a:p>|<\/w:p>/g)||[]).map(x=>/^<\/(a|w):p>$/.test(x)?'\n':x.replace(/<[^>]+>/g,'')).join(' ');
    const dec=t.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
    out.push((kind==='pptx'?'[Slide '+(i+1)+'] ':'')+dec.replace(/[ \t]+/g,' ').replace(/\s*\n\s*/g,'\n').trim());
  }
  return out.join('\n');
}

async function runUpload(){
  const g=S.up, f=g.fileObj; if(!f) return;
  g.err=''; g.stage='reading'; g.msg='Reading your slides…'; render();
  let text='', images=[];
  try{
    const buf=await f.arrayBuffer(), name=f.name.toLowerCase();
    if(name.endsWith('.pdf')){ const r=await pdfText(buf,(i,n,k)=>{ const m=$('#up-msg'); if(m) m.textContent=k==='photo'?`Scanning page ${i} of ${n}…`:`Reading slide ${i} of ${n}…`; }); text=r.text; images=r.images; }
    else if(name.endsWith('.pptx')) text=await zipXmlText(buf,'pptx');
    else if(name.endsWith('.docx')) text=await zipXmlText(buf,'docx');
    else if(name.endsWith('.txt')) text=new TextDecoder().decode(buf);
    else throw new Error('type');
  }catch(e){ g.stage=''; g.err=e.message==='type'?'That file type isn’t supported. Use PDF, PowerPoint (.pptx), Word (.docx) or a text file. Old .ppt files must be saved as .pptx first.':e.message==='load'?'Couldn’t load the file reader. Check your connection and try again.':'Couldn’t read that file. If it’s password-protected or damaged, try another copy.'; render(); return; }
  text=text.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  if(!images.length&&text.replace(/\[Slide \d+\]/g,'').replace(/\s/g,'').length<250){ g.stage=''; g.err='We couldn’t find enough text in this file. It may be scanned pages or pictures of slides, which can’t be read yet.'; render(); return; }
  g.scan=images.length>0; g.stage='writing'; render();
  // Same file + same count tapped again re-uses the job id, so a result the phone missed is handed back free.
  const jobKey=[g.file,g.size,g.count].join('|');
  if(g.jobKey!==jobKey){ g.jobKey=jobKey; g.jobId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g,()=>(Math.random()*16|0).toString(16)); }
  const jobId=g.jobId;
  const payload=JSON.stringify({device_id:deviceId(),job_id:jobId,title:g.file,count:g.count,text:text.slice(0,60000),images});
  const say=(t)=>{ const m=$('#up-msg'); if(m) m.textContent=t; };
  const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
  try{
    let j=null, netFails=0, busyFails=0;
    while(!j){
      let r;
      try{ r=await fetch(SB_URL+'/functions/v1/generate-questions',{method:'POST',headers:SB_HEAD,body:payload}); }
      catch(e){
        // Connection dropped (Safari: "Load failed"). The server may have finished anyway, so ask again with the same job id.
        if(++netFails>3) throw new Error('net');
        say('Connection dropped. Reconnecting…'); await wait(3000*netFails); say('Writing your questions…'); continue;
      }
      let b={}; try{ b=await r.json(); }catch(e){ if(r.ok){ if(++netFails>3) throw new Error('net'); say('Connection dropped. Reconnecting…'); await wait(3000); continue; } }
      if(r.ok&&b.questions){ j=b; break; }
      if(b.code==='busy'&&r.status===503&&busyFails<1){ busyFails++; say('The AI is busy. Trying again…'); await wait(10000); say('Writing your questions…'); continue; }
      throw new Error(b.error||'Couldn’t generate questions right now. Please try again.');
    }
    const set={id:'my-'+Date.now().toString(36), name:j.title||g.file.replace(/\.[^.]+$/,''), file:g.file, at:Date.now(), qs:j.questions};
    const all=[set,...mySets()].slice(0,12); store.set('pqh-mysets',all);
    S.up={count:g.count};
    S.course=mySetCourse(set); S.exam=null; S.quiz=null; S.set=freshSettings(); S.qa={term:'',hide:false,part:'mcq',shown:new Set()};
    go('course');
    if(typeof j.remaining==='number') setTimeout(()=>{ const t=document.createElement('div'); t.className='vtoast show'; t.innerHTML=`<b>${j.questions.length} questions ready.</b> ${j.remaining} upload${j.remaining===1?'':'s'} left today.`; document.body.appendChild(t); setTimeout(()=>{t.classList.remove('show'); setTimeout(()=>t.remove(),500);},3500); },300);
  }catch(e){ g.stage=''; const m=e&&e.message||''; g.err=(m&&m!=='net'&&!/fetch|load failed|network/i.test(m))?m:'Your connection dropped before the questions arrived. Check your data or Wi-Fi and tap Generate again. If they were already made, you won’t lose an upload.'; render(); }
}

/* ---------- device details (no personal data: phone type, OS, browser, screen) ---------- */
async function deviceInfo(){
  const ua=navigator.userAgent||'', cut=(v,n)=>v?String(v).slice(0,n):null;
  let os='Other', osv='', browser='Other', model='', type='desktop', m;
  if(/iPhone/.test(ua)){ os='iOS'; model='iPhone'; type='phone'; if(m=ua.match(/OS (\d+)[_.](\d+)/)) osv=m[1]+'.'+m[2]; }
  else if(/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)){ os='iPadOS'; model='iPad'; type='tablet'; if(m=ua.match(/OS (\d+)[_.](\d+)/)) osv=m[1]+'.'+m[2]; else if(m=ua.match(/Version\/(\d+(\.\d+)?)/)) osv=m[1]; }
  else if(/Android/.test(ua)){
    os='Android'; type=/Mobile|Opera Mini/.test(ua)?'phone':'tablet';
    if(m=ua.match(/Android (\d+(\.\d+)?)/)) osv=m[1];
    if(m=ua.match(/Android [\d.]+;\s*([^;)]+)/)){ const t=m[1].replace(/\s+Build\/.*$/,'').trim(); if(t&&!/^(K|wv|Linux|Mobile|U)$/i.test(t)) model=t; }
  }
  else if(/Windows/.test(ua)){ os='Windows'; }
  else if(/Mac OS X/.test(ua)){ os='macOS'; }
  else if(/CrOS/.test(ua)){ os='ChromeOS'; }
  else if(/Linux/.test(ua)){ os='Linux'; }
  try{
    if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues){
      const h=await Promise.race([navigator.userAgentData.getHighEntropyValues(['model','platformVersion']),new Promise(r=>setTimeout(()=>r({}),800))]);
      if(h.model&&!model) model=h.model;
      if(os==='Android'&&h.platformVersion&&!osv) osv=h.platformVersion.split('.').slice(0,2).join('.').replace(/\.0$/,'');
    }
  }catch(e){}
  if(model){
    if(/^SM-/i.test(model)) model='Samsung '+model;
    else if(/^RMX/i.test(model)) model='Realme '+model;
    else if(/^CPH/i.test(model)) model='Oppo '+model;
    else if(/^(V2\d{3}|vivo)/i.test(model)&&!/^vivo/i.test(model)) model='Vivo '+model;
    else if(/^Pixel/i.test(model)) model='Google '+model;
  }
  if(/OperaMini|Opera Mini/.test(ua)) browser='Opera Mini';
  else if(/OPR\/|OPiOS|Opera/.test(ua)) browser='Opera';
  else if(/FBAN|FBAV/.test(ua)) browser='Facebook app';
  else if(/Instagram/.test(ua)) browser='Instagram app';
  else if(/SamsungBrowser/.test(ua)) browser='Samsung Internet';
  else if(/UCBrowser/.test(ua)) browser='UC Browser';
  else if(/PHX\//.test(ua)) browser='Phoenix';
  else if(/EdgA|EdgiOS|Edg\//.test(ua)) browser='Edge';
  else if(/CriOS/.test(ua)) browser='Chrome';
  else if(/FxiOS|Firefox/.test(ua)) browser='Firefox';
  else if(/; wv\)/.test(ua)) browser='In-app browser';
  else if(/Chrome\//.test(ua)) browser='Chrome';
  else if(/Safari\//.test(ua)) browser='Safari';
  const sw=Math.round(screen.width||0), sh=Math.round(screen.height||0);
  return {os:cut(os,30), os_version:cut(osv,20)||null, browser:cut(browser,30), model:cut(model,60)||null, device_type:type, screen:sw&&sh?`${sw}x${sh}`:null};
}
/* ---------- render ---------- */
const calm = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el){
  const to=+el.dataset.to; if(calm()||!to) return;
  const t0=performance.now(), d=1100;
  const step=t=>{ const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3); el.textContent=Math.round(to*e)+'%'; if(k<1) requestAnimationFrame(step); };
  el.textContent='0%'; requestAnimationFrame(step);
}
function confetti(){
  if(calm()) return;
  const cv=document.createElement('canvas'); cv.className='confetti'; document.body.appendChild(cv);
  const dpr=window.devicePixelRatio||1, W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr, g=cv.getContext('2d');
  const cs=getComputedStyle(document.documentElement), cols=['--brand','--accent','--good','--accent-soft'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:130},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.3,vx:(Math.random()-.5)*16*dpr,vy:(-Math.random()*14-6)*dpr,w:(6+Math.random()*6)*dpr,h:(3+Math.random()*4)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  const step=t=>{ const el=t-t0; g.clearRect(0,0,W,H); g.globalAlpha=Math.max(0,1-el/2600);
    P.forEach(p=>{ p.vy+=.45*dpr; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c; g.fillRect(-p.w/2,-p.h/2,p.w,p.h); g.restore(); });
    if(el<2600) requestAnimationFrame(step); else cv.remove(); };
  requestAnimationFrame(step);
}
function screenKey(){
  if(S.screen==='exam') return S.exam.done?'ex-res':'ex-'+S.exam.cur;
  if(S.screen==='quiz') return S.quiz.done?'qz-res':'qz-'+S.quiz.i+'-'+S.quiz.qs.length;
  return S.screen;
}
function render(){
  const app=$('#app'), key=screenKey(), fx=S.fx; S.fx=null;
  app.classList.remove('enter','fx-answer','fx-pick'); void app.offsetWidth;
  if(key!==S.lastKey) app.classList.add('enter');
  if(fx) app.classList.add('fx-'+fx);
  S.lastKey=key;
  let html;
  switch(S.screen){
    case 'exam-setup': html=examSetup(); break;
    case 'exam': html=S.exam.done?examResult():examRun(); break;
    case 'quiz-setup': html=quizSetup(); break;
    case 'quiz': html=S.quiz.done?quizResult():quizRun(); break;
    case 'qa': html=qaView(); break;
    case 'admin': html=adminView(); break;
    case 'course': html=course(); break;
    case 'slides': html=slidesView(); break;
    default: html=courses();
  }
  app.innerHTML=html;
  if(S.screen==='qa') qaList();
  clearInterval(adTimer); if(S.screen==='admin'){ loadAdmin(); adTimer=setInterval(loadAdmin,30000); }
  document.body.classList.toggle('dlg-open',!!S.sg&&S.screen==='courses');
  document.body.classList.toggle('no-float',!['courses','course'].includes(S.screen));
  document.body.classList.toggle('in-session',(S.screen==='exam'&&!S.exam.done)||(S.screen==='quiz'&&!S.quiz.done));
  if(key.endsWith('-res')){
    const o=S.screen==='exam'?S.exam:S.quiz, r=app.querySelector('.ring-pct');
    const pct=S.screen==='exam'?o.pct:quizPct(o);
    if(r&&!o.counted){ o.counted=true; countUp(r); }
    if(pct>=70&&!o.celebrated){ o.celebrated=true; setTimeout(confetti,450); }
  }
}
function go(screen){ S.screen=screen; render(); window.scrollTo(0,0); }
