function showOy(next,note){
  const wait=calm()?0:5000;
  const row='COORDINATION AGENDA · VOTE 003 · OYEKOLA · ';
  const ov=document.createElement('div'); ov.className='oy-page'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-label','Vote Oyekola for UI SU General Secretary');
  ov.innerHTML=`<span class="oy-orb o1"></span><span class="oy-orb o2"></span><span class="oy-orb o3"></span>
  <div class="oy-bg" aria-hidden="true">${Array.from({length:7},()=>`<div>${row.repeat(6)}</div>`).join('')}</div>
  <div class="oy-card">
    ${note?`<p class="oy-note">${ic('check')}<span>${note}</span></p>`:''}
    <div class="oy-photo"><img src="${OY_PHOTO}" alt="Oyekola, candidate number 003 for UI SU General Secretary"><span class="oy-ring"></span><span class="oy-chip"><i></i>UI SU Elections</span></div>
    <h2 class="oy-vote" aria-label="Vote"><span>V</span><span>O</span><span>T</span><span>E</span></h2>
    <p class="oy-name">OYEKOLA</p>
    <div class="oy-facts"><div><b>003</b><span>Ballot no.</span></div><div><b>Gen Sec</b><span>Position</span></div><div><b>UI SU</b><span>Union</span></div></div>
    <p class="oy-slogan">Stay coordinated.</p>
    <span class="oy-logo">${logoSvg(22)}</span>
    <button class="oy-go" type="button" ${wait?'disabled':''}><i></i><span>${wait?'Please wait…':'Continue'}</span></button>
  </div>`;
  document.body.appendChild(ov);
  const btn=ov.querySelector('.oy-go'), lab=btn.querySelector('span');
  setTimeout(()=>{ btn.disabled=false; lab.innerHTML='Continue '+ic('right'); try{btn.focus({preventScroll:true})}catch(_){} },wait);
  btn.addEventListener('click',()=>{
    if(btn.disabled) return;
    ov.style.transition='opacity .45s ease'; ov.style.opacity='0';
    setTimeout(()=>{ ov.remove(); next(); },calm()?0:450);
  });
}
const LEAVE_RESULT=new Set(['nav','ex-new','ex-practise','qz-new','qz-retry']);
function resultObj(){ if(S.screen==='exam'&&S.exam&&S.exam.done) return S.exam; if(S.screen==='quiz'&&S.quiz&&S.quiz.done) return S.quiz; return null; }
/* ---------- events ---------- */
const app=$('#app');
app.addEventListener('change',e=>{
  const el=e.target, ex=S.set.ex, qz=S.set.qz;
  if(el.name==='ex-count'){ ex.count=+el.value; ex.time=null; render(); }
  else if(el.name==='ex-time'){ ex.time=+el.value; render(); }
  else if(el.name==='qz-count'){ qz.count=+el.value; render(); }
  else if(el.id==='up-file'){ const f=el.files&&el.files[0]; S.up=S.up||{count:20}; if(f){ if(f.size>25*1024*1024){ S.up.err='That file is bigger than 25 MB. Try a smaller copy.'; } else { S.up.fileObj=f; S.up.file=f.name; S.up.size=f.size; S.up.err=''; } } render(); }
  else if(el.name==='up-count'){ S.up=S.up||{}; S.up.count=+el.value; render(); }
  else if(el.name==='ex-part'){ ex.part=el.value; ex.count=30; ex.time=null; render(); }
  else if(el.name==='qz-part'){ qz.part=el.value; qz.count=20; render(); }
  else if(el.name==='qz-sec'){ qz.sec=+el.value; render(); }
  else if(el.id==='qa-hide'){ S.qa.hide=el.checked; S.qa.shown.clear(); qaList(); }
});
app.addEventListener('submit',e=>{
  if(e.target.id==='fill-form'){
    e.preventDefault(); const v=$('#fill-input').value.trim();
    if(S.screen==='exam'&&S.exam&&!S.exam.done){ const x=S.exam; if(v) x.ans[x.cur]=v; else delete x.ans[x.cur]; if(x.cur<x.qs.length-1){ x.cur++; } S.fx='pick'; render(); window.scrollTo(0,0); }
    else if(S.screen==='quiz'&&S.quiz&&!S.quiz.done&&S.quiz.picked===null&&!S.quiz.timedOut&&v){ const z=S.quiz; lockQuiz(); z.picked=v; if(ok(z.qs[z.i],v)) z.score++; z.log.push({q:z.qs[z.i],p:v,t:z.sec*1000-z.frozenMs}); S.fx='answer'; render(); }
    return;
  }
  if(e.target.id==='sg-form'){ e.preventDefault(); if(S.sg&&!S.sg.busy) sendSuggestion(); return; }
  if(e.target.id==='ad-form'){ e.preventDefault(); const v=$('#ad-pin').value.trim(); if(!v) return; try{sessionStorage.setItem('pqh-pin',v)}catch(err){} render(); } });
app.addEventListener('input',e=>{
  if(e.target.id==='fill-input'&&S.screen==='exam'&&S.exam&&!S.exam.done){
    const x=S.exam, v=e.target.value.trim(); if(v) x.ans[x.cur]=v; else delete x.ans[x.cur];
    const c=document.querySelector(`.cell[data-i="${x.cur}"]`); if(c) c.classList.toggle('done',!!v);
    const sub=$('#ab-sub'); if(sub) sub.textContent=`${Object.keys(x.ans).length} of ${x.qs.length} answered`;
  } if(e.target.id==='qa-search'){ S.qa.term=e.target.value; qaList(); } if(e.target.id==='course-search'){ S.courseTerm=e.target.value; $('#course-cards').innerHTML=courseList(); } });
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, x=S.exam, z=S.quiz;
  { const r=resultObj(); if(r&&LEAVE_RESULT.has(a)&&!r.oySeen){ r.oySeen=true; showOy(()=>b.click()); return; } }
  switch(a){
    case 'nav': go(b.dataset.to); break;
    case 'open-my':{
      const m=mySets().find(k=>k.id===b.dataset.id); if(!m) break;
      if(!S.course||S.course.id!==m.id){ S.course=mySetCourse(m); S.exam=null; S.quiz=null; S.set=freshSettings(); S.qa={term:'',hide:false,part:'mcq',shown:new Set()}; }
      go('course'); break;}
    case 'my-del':{
      if(b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.textContent='Tap again to delete'; b.classList.add('primary'); break; }
      store.set('pqh-mysets',mySets().filter(k=>k.id!==b.dataset.id)); S.course=COURSES[0]; S.exam=null; S.quiz=null; go('courses'); break;}
    case 'up-go': if(S.up&&S.up.fileObj&&!S.up.stage) runUpload(); break;
    case 'open-course':{
      const c=COURSES.find(k=>k.id===b.dataset.id);
      if(c!==S.course){ S.course=c; S.exam=null; S.quiz=null; S.set=freshSettings(); S.qa={term:'',hide:false,shown:new Set()}; }
      go('course'); break;}
    case 'theme': applyTheme(b.dataset.t); store.set('pqh-theme',b.dataset.t); render(); break;
    case 'sound': S.sound=!S.sound; store.set('pqh-sound',S.sound); render(); if(S.sound) SFX.tap(); break;
    case 'go':{
      const to=b.dataset.to;
      if(to==='exam') go(S.exam?'exam':'exam-setup');
      else if(to==='quiz') go(S.quiz?'quiz':'quiz-setup');
      else go('qa');
      break;}
    case 'ex-start':{
      logEvent('attempt_start',{course:S.course.id,mode:'exam'});
      const st=S.set.ex, m=st.time||Math.ceil(st.count*1.5/5)*5, now=Date.now();
      S.exam={qs:shuffle(playPool(st.part)).slice(0,st.count),ans:{},cur:0,startAt:now,endAt:now+m*60000,done:false,confirm:false};
      go('exam'); break;}
    case 'pick':
      if(S.screen==='exam'&&x&&!x.done){ x.ans[x.cur]=b.dataset.l; S.fx='pick'; SFX.tap(); render(); }
      else if(S.screen==='quiz'&&z&&!z.done&&z.picked===null&&!z.timedOut){
        lockQuiz(); z.picked=b.dataset.l; if(ok(z.qs[z.i],z.picked)) z.score++;
        z.log.push({q:z.qs[z.i],p:z.picked,t:z.sec*1000-z.frozenMs}); S.fx='answer'; SFX[ok(z.qs[z.i],z.picked)?'correct':'wrong'](); render();
      } break;
    case 'ex-prev': x.cur--; render(); window.scrollTo(0,0); break;
    case 'ex-next': x.cur++; render(); window.scrollTo(0,0); break;
    case 'ex-go': x.cur=+b.dataset.i; render(); window.scrollTo(0,0); break;
    case 'ex-submit': x.confirm=true; render(); break;
    case 'ex-cancel': x.confirm=false; render(); break;
    case 'ex-submit-now': finishExam(false); break;
    case 'ex-filter': x.filter=b.dataset.f; render(); break;
    case 'ex-new': S.exam=null; go('exam-setup'); break;
    case 'ex-practise': startQuiz(shuffle(x.qs.filter((q,i)=>!(x.ans[i]&&ok(q,x.ans[i])))),S.set.qz.sec); break;
    case 'qz-start': startQuiz(shuffle(playPool(S.set.qz.part)).slice(0,S.set.qz.count),S.set.qz.sec); break;
    case 'qz-next':
      if(z.i>=z.qs.length-1){ z.done=true; saveBest('quiz',quizPct(z)); finishEvent('quiz',z.score,z.log.length); if(quizPct(z)>=50) SFX.done(); }
      else { z.i++; z.picked=null; z.timedOut=false; z.qEnd=Date.now()+z.sec*1000; }
      render(); window.scrollTo(0,0); break;
    case 'qz-quit': z.done=true; if(z.log.length){ saveBest('quiz',quizPct(z)); finishEvent('quiz',z.score,z.log.length); } render(); window.scrollTo(0,0); break;
    case 'qz-new': S.quiz=null; go('quiz-setup'); break;
    case 'qz-retry': startQuiz(shuffle(z.log.filter(o=>!(o.p&&ok(o.q,o.p))).map(o=>o.q)),z.sec); break;
    case 'qz-filter': z.filter=b.dataset.f; render(); break;
    case 'jump':{
      const k=b.dataset.k, o=S.screen==='exam'?S.exam:S.quiz;
      if(!document.getElementById('rv-'+k)&&o.filter!=='all'){ o.filter='all'; render(); }
      const el=document.getElementById('rv-'+k);
      if(el) el.scrollIntoView({behavior:calm()?'auto':'smooth',block:'start'});
      else if(S.screen==='quiz'){ /* question not reached */ }
      break;}
    case 'ad-refresh': loadAdmin(); break;
    case 'ad-lock': try{sessionStorage.removeItem('pqh-pin')}catch(e){} render(); break;
    case 'qa-part': S.qa.part=b.dataset.p; S.qa.shown.clear(); render(); break;
    case 'sg-open': S.sg={}; render(); setTimeout(()=>{const i=$('#sg-code'); if(i) i.focus();},50); break;
    case 'sg-close': S.sg=null; render(); break;
    case 'qa-show': S.qa.shown.add(+b.dataset.n); qaList(); break;
  }
});

function tick(){
  const now=Date.now(), x=S.exam, z=S.quiz;
  if(x&&!x.done){
    if(now>=x.endAt) finishExam(true);
    else if(S.screen==='exam'){ const v=$('#tval'), t=$('#timer'); if(v) v.textContent=fmt(x.endAt-now); if(t) t.classList.toggle('low',x.endAt-now<60000); }
    else if(S.screen==='course'){ const h=$('#home-left'); if(h) h.textContent=fmt(x.endAt-now); }
  }
  if(z&&!z.done&&z.picked===null&&!z.timedOut){
    if(now>=z.qEnd){ z.timedOut=true; z.frozen=0; z.frozenMs=0; z.log.push({q:z.qs[z.i],p:null,t:z.sec*1000}); SFX.timeup(); if(S.screen==='quiz'){ S.fx='answer'; render(); } }
    else if(S.screen==='quiz'){
      const rem=z.qEnd-now, v=$('#tval'), t=$('#timer'), f=$('#pfill');
      if(v) v.textContent=fmt(rem); if(t) t.classList.toggle('low',rem<10000);
      if(f) f.style.width=(rem/(z.sec*1000)*100)+'%';
    }
  }
}
(function(){
  const sym=['∑','π','√','∫','∞','θ','Δ','±','x²','λ','÷','∂','≠','≈','α','β','eˣ','Σ','∛','×'];
  const box=document.createElement('div'); box.className='float'; box.setAttribute('aria-hidden','true');
  const n=window.innerWidth<600?14:22, R=(a,b)=>a+Math.random()*(b-a);
  for(let k=0;k<n;k++){
    const i=document.createElement('i');
    i.textContent=k<3?'∑':sym[Math.floor(Math.random()*sym.length)];
    if(Math.random()<.22) i.className='r';
    const big=k<3;
    i.style.cssText=`left:${R(-4,94)}%;top:${R(4,94)}%;font-size:${big?R(70,110):R(22,54)}px;--op:${big?.07:R(.07,.15).toFixed(2)};--dur:${R(14,26).toFixed(1)}s;--del:${(-R(0,20)).toFixed(1)}s;--del0:${R(0,1.2).toFixed(2)}s;--dx:${R(-50,50).toFixed(0)}px;--dy:${R(-70,-20).toFixed(0)}px;--r0:${R(-15,15).toFixed(0)}deg;--r1:${R(-25,25).toFixed(0)}deg`;
    box.appendChild(i);
  }
  document.body.insertBefore(box,document.body.firstChild);
})();
(function(){
  const el=document.createElement('div'); el.className='sigma'; el.innerHTML='<b>Vote <span class="oy">Oyekola</span></b><span>UI SU General Secretary</span>'; el.setAttribute('aria-label','Vote Oyekola for UI SU General Secretary'); el.title='Drag me';
  document.body.appendChild(el);
  /* ballot box drop target */
  const box=document.createElement('div'); box.className='ballot'; box.setAttribute('aria-hidden','true');
  let votes=+store.get('pqh-votes',0)||0;
  box.innerHTML=`<span class="b-ring" aria-hidden="true"></span><svg viewBox="0 0 88 80"><g class="b-paper"><rect x="30" y="4" width="28" height="30" rx="3" fill="#FFFFFF" stroke="#0B2A5B" stroke-width="2"/><path d="M37 19l5 5 9-10" fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="6" y="26" width="76" height="50" rx="8" class="b-body"/><rect x="24" y="26" width="40" height="6" rx="3" fill="rgba(0,0,0,.35)"/><text x="44" y="61" text-anchor="middle" font-family="Outfit,Arial,sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">BALLOT</text></svg><span class="b-hint">Drop to vote</span><span class="b-done">You voted ✓</span>`;
  document.body.appendChild(box);
  const toast=document.createElement('div'); toast.className='vtoast'; toast.setAttribute('role','status'); toast.hidden=true; document.body.appendChild(toast);
  let dropping=false;

  const overBox=()=>{ const b=box.getBoundingClientRect(), cx=x+SW()/2, cy=y+SH()/2; return b.width>0&&cx>b.left-30&&cx<b.right+30&&cy>b.top-40&&cy<b.bottom+20; };
  function castVote(){
    dropping=true; vx=vy=0;
    const b=box.getBoundingClientRect(), tx=b.left+b.width/2-SW()/2, ty=b.top+b.height*0.32-SH()/2;
    el.style.transition='transform .7s cubic-bezier(.55,0,.75,.2),opacity .7s ease';
    el.style.transform=`translate(${tx}px,${ty}px) rotate(0deg) scale(.12)`; el.style.opacity='0';
    setTimeout(()=>{
      votes++; store.set('pqh-votes',votes); if(!store.get('pqh-voted',false)){ store.set('pqh-voted',true); logEvent('vote'); }
      box.classList.remove('bump'); void box.offsetWidth; box.classList.add('bump','voted');
      toast.innerHTML=`<b>Vote cast!</b> <span class="oy">Oyekola</span> for UI SU General Secretary. Stay coordinated.`;
      toast.hidden=false; toast.classList.remove('show'); void toast.offsetWidth; toast.classList.add('show');
      clearTimeout(toast._t); toast._t=setTimeout(()=>{ toast.classList.remove('show'); setTimeout(()=>toast.hidden=true,500); },3200);
      if(votes%5===0||votes===1) confetti();
    },680);
    setTimeout(()=>{ el.remove(); },900);
  }
  const still=calm(), SW=()=>el.offsetWidth||200, SH=()=>el.offsetHeight||56, TOP=()=>70;
  let ph=0;
  let x=Math.max(0,innerWidth*0.3), y=innerHeight*0.55, vx=0.7, vy=-0.5, rot=-8, spin=0.12, drag=null;
  const CRUISE=0.8, MAXV=28;
  function step(){
    if(!drag&&!dropping){
      const sp=Math.hypot(vx,vy);
      if(still){ vx*=.9; vy*=.9; }
      else if(sp>CRUISE){ vx*=.975; vy*=.975; }
      else if(sp<0.05){ const a=Math.random()*Math.PI*2; vx=Math.cos(a)*.4; vy=Math.sin(a)*.4; }
      else if(sp<CRUISE*.7){ vx*=1.01; vy*=1.01; }
      x+=vx; y+=vy;
      const W=innerWidth-SW(), H=innerHeight-SH();
      if(x<0){x=0;vx=Math.abs(vx)*.85} if(x>W){x=Math.max(0,W);vx=-Math.abs(vx)*.85}
      if(y<TOP()){y=TOP();vy=Math.abs(vy)*.85} if(y>H){y=Math.max(TOP(),H);vy=-Math.abs(vy)*.85}
      if(!still){ ph+=0.012; const target=Math.sin(ph)*6+Math.max(-10,Math.min(10,vx*1.5)); rot+=(target-rot)*0.04; }
    }
    if(!dropping) el.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg) scale(${drag?1.15:1})`;
    requestAnimationFrame(step);
  }
  el.addEventListener('pointerdown',e=>{
    if(dropping) return;
    e.preventDefault();
    drag={id:e.pointerId,ox:e.clientX-x,oy:e.clientY-y,lx:e.clientX,ly:e.clientY,lt:performance.now()};
    vx=vy=0; el.classList.add('grab'); try{el.setPointerCapture(e.pointerId)}catch(_){} SFX.tap();
  });
  el.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id) return;
    const t=performance.now(), dt=Math.max(8,t-drag.lt);
    vx=(e.clientX-drag.lx)/dt*16; vy=(e.clientY-drag.ly)/dt*16;
    drag.lx=e.clientX; drag.ly=e.clientY; drag.lt=t;
    x=Math.min(Math.max(0,e.clientX-drag.ox),innerWidth-SW()); y=Math.min(Math.max(TOP(),e.clientY-drag.oy),innerHeight-SH());
    rot+=((Math.max(-14,Math.min(14,vx*2)))-rot)*0.25;
    box.classList.toggle('hot',overBox());
  });
  const drop=e=>{
    if(!drag) return; drag=null; el.classList.remove('grab');
    if(overBox()){ box.classList.remove('hot'); castVote(); return; }
    const sp=Math.hypot(vx,vy); if(sp>MAXV){ vx*=MAXV/sp; vy*=MAXV/sp; }
    spin=Math.max(-6,Math.min(6,vx*0.4))||0.12;
  };
  el.addEventListener('pointerup',drop); el.addEventListener('pointercancel',drop);
  addEventListener('resize',()=>{ x=Math.max(0,Math.min(x,innerWidth-SW())); y=Math.max(TOP(),Math.min(y,innerHeight-SH())); });
  requestAnimationFrame(step);
})();
setInterval(tick,250);
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(S.screen==='courses'||S.screen==='course') render(); }); }catch(e){}
if(location.hash==='#admin') S.screen='admin';
addEventListener('hashchange',()=>{ if(location.hash==='#admin'){ S.screen='admin'; render(); } });
if(S.screen!=='admin') deviceInfo().then(i=>logEvent('visit',i)).catch(()=>logEvent('visit'));
render();
