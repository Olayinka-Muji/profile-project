<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
img,svg{max-width:100%}
[hidden]{display:none!important}
button,input,select{touch-action:manipulation}
input,select{font-size:16px}

<title>Coordination Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@400;500;600;700;800&family=Urbanist:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app bar + single column. Course and mode pickers are cards with tinted icon tiles; exam/quiz screens stay flat CBT rows with a fixed bottom bar. Brand: navy / red / white, with a dark theme. */
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F3F6FA;--line:#DDE3EC;--ink:#0B1F44;--muted:#5A667C;
  --brand:#0B2A5B;--on-brand:#FFFFFF;--brand-soft:#E7EDF6;
  --accent:#C8102E;--accent-hover:#A00D25;--on-accent:#FFFFFF;--accent-soft:#FCE8EB;
  --good:#17784A;--good-soft:#E3F3EA;
  --bar:#0B2A5B;--on-bar:#FFFFFF;--bar-muted:#C3D0E6;--bar-line:rgba(255,255,255,.22);
  --scrim:rgba(11,31,68,.45);--shadow:0 1px 2px rgba(11,42,91,.05),0 6px 18px rgba(11,42,91,.06);
  --sans:'Urbanist',Arial,'Helvetica Neue',Helvetica,sans-serif;
  --display:'Outfit','Urbanist',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E17;--surface:#111725;--surface-2:#172033;--line:#253049;--ink:#EEF2F8;--muted:#98A3B8;
  --brand:#7AA2F7;--on-brand:#0A0E17;--brand-soft:#17223B;
  --accent:#EE4A5F;--accent-hover:#D93A4F;--on-accent:#FFFFFF;--accent-soft:#33161E;
  --good:#45C98B;--good-soft:#10291D;
  --bar:#0A0E17;--on-bar:#EEF2F8;--bar-muted:#98A3B8;--bar-line:#253049;
  --scrim:rgba(0,0,0,.6);--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E17;--surface:#111725;--surface-2:#172033;--line:#253049;--ink:#EEF2F8;--muted:#98A3B8;
  --brand:#7AA2F7;--on-brand:#0A0E17;--brand-soft:#17223B;
  --accent:#EE4A5F;--accent-hover:#D93A4F;--on-accent:#FFFFFF;--accent-soft:#33161E;
  --good:#45C98B;--good-soft:#10291D;
  --bar:#0A0E17;--on-bar:#EEF2F8;--bar-muted:#98A3B8;--bar-line:#253049;
  --scrim:rgba(0,0,0,.6);--shadow:none;color-scheme:dark}
:root.force-light{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F3F6FA;--line:#DDE3EC;--ink:#0B1F44;--muted:#5A667C;
  --brand:#0B2A5B;--on-brand:#FFFFFF;--brand-soft:#E7EDF6;
  --accent:#C8102E;--accent-hover:#A00D25;--on-accent:#FFFFFF;--accent-soft:#FCE8EB;
  --good:#17784A;--good-soft:#E3F3EA;
  --bar:#0B2A5B;--on-bar:#FFFFFF;--bar-muted:#C3D0E6;--bar-line:rgba(255,255,255,.22);
  --scrim:rgba(11,31,68,.45);--shadow:0 1px 2px rgba(11,42,91,.05),0 6px 18px rgba(11,42,91,.06);color-scheme:light}
:root.force-dark{
  --bg:#0A0E17;--surface:#111725;--surface-2:#172033;--line:#253049;--ink:#EEF2F8;--muted:#98A3B8;
  --brand:#7AA2F7;--on-brand:#0A0E17;--brand-soft:#17223B;
  --accent:#EE4A5F;--accent-hover:#D93A4F;--on-accent:#FFFFFF;--accent-soft:#33161E;
  --good:#45C98B;--good-soft:#10291D;
  --bar:#0A0E17;--on-bar:#EEF2F8;--bar-muted:#98A3B8;--bar-line:#253049;
  --scrim:rgba(0,0,0,.6);--shadow:none;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;font-weight:500;line-height:1.5;transition:background .2s,color .2s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:18px;height:18px;flex:none}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bar);color:var(--on-bar);border-bottom:1px solid var(--bar-line)}
.appbar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:62px;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{display:flex;gap:3px;flex:none}
.mark i{width:10px;height:14px;border-radius:50%;border:1.5px solid var(--on-bar)}
.mark i:nth-child(2){background:var(--accent);border-color:var(--accent)}
.ca-logo{display:inline-flex;align-items:center}
.ca-logo img{display:block;height:28px;width:auto;max-width:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.logo b{font-family:var(--display);font-weight:800;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.ab-title b{font-family:var(--display);font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-title span{font-size:.75rem;color:var(--bar-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.icon-btn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--bar-line);background:transparent;color:var(--on-bar);display:grid;place-items:center}
.icon-btn .ico{width:20px;height:20px}
.themetog{display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--bar-line);flex:none}
.themetog button{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--bar-muted);display:grid;place-items:center}
.themetog button[aria-pressed="true"]{background:var(--on-bar);color:var(--bar)}
.themetog .ico{width:17px;height:17px}
.timer{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:7px 11px;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{background:var(--on-bar);color:var(--accent)}
.ab-prog{height:4px;background:var(--bar-line)}
.ab-prog i{display:block;height:100%;background:var(--accent);transition:width .25s linear}

/* page */
.page{max-width:720px;margin:0 auto;padding-block:26px 48px;display:flex;flex-direction:column;gap:16px}
body.in-session .page{padding-bottom:124px}
.h1{margin:0;font-family:var(--display);font-weight:600;font-size:2.1rem;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:1rem;max-width:60ch}
.kicker{margin:0;font-family:var(--display);font-size:.82rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.sec{margin:12px 0 0;font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.meta{margin:0;font-size:.875rem;color:var(--muted)}
.meta b{color:var(--ink)}
.note{margin:6px 0 0;font-size:.78rem;color:var(--muted)}
.blue{color:var(--brand)} .red{color:var(--accent)} .green{color:var(--good)}

.search{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0 18px;color:var(--muted)}
.search:focus-within{border-color:var(--brand)}
.search .ico{width:20px;height:20px}
.search input{border:0;outline:0;flex:1;min-width:0;height:54px;font-size:1rem;background:transparent;color:var(--ink)}
.search input::placeholder{color:var(--muted)}

/* cards */
.cards{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;color:var(--ink);box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
button.card:hover{border-color:var(--brand)}
.tile{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;margin-bottom:8px}
.tile .ico{width:24px;height:24px}
.tile.blue{background:var(--brand-soft)} .tile.red{background:var(--accent-soft)} .tile.green{background:var(--good-soft)}
.card h3{margin:0;font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:.98rem}
.card .cmeta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);font-weight:600}
.card .cmeta b{color:var(--ink)}
.card .cmeta .live{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.ccode{display:block;margin:0;font-family:var(--display);font-size:2.4rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.ccode.big{font-size:clamp(3rem,14vw,4.2rem)}
.card h3.ctitle,.ctitle{margin:4px 0 0;font-family:var(--display);font-size:1.05rem;font-weight:600;color:var(--ink);line-height:1.3;letter-spacing:0}
.ctitle.big{font-size:1.2rem;margin-top:-6px}
.card.soon{border-style:dashed;box-shadow:none;background:transparent;align-items:flex-start}
.card.soon h3{font-size:1.1rem}

.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.stats.four{grid-template-columns:repeat(4,1fr)}
.stats>div{padding:12px 14px;min-width:0}
.stats>div+div{border-left:1px solid var(--line)}
.stats dt{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:2px 0 0;font-family:var(--display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.stats dd.good{color:var(--good)} .stats dd.bad{color:var(--accent)}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.topics span{font-size:.78rem;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--surface-2);color:var(--ink)}

/* setup */
.field{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;padding:9px 15px;border:1px solid var(--line);border-radius:12px;font-weight:700;font-size:.9rem;background:var(--surface);cursor:pointer;font-variant-numeric:tabular-nums}
.chip span:hover{border-color:var(--brand)}
.chip input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.btn{min-height:52px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--display);font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){border-color:var(--brand)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 170px}

/* question (flat CBT rows) */
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:.875rem;color:var(--muted);font-weight:700;flex-wrap:wrap}
.qmeta b{color:var(--ink)}
.qmeta .src{font-weight:500;font-size:.75rem}
.qtext{margin:0;font-size:1.14rem;font-weight:600;line-height:1.55;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.opt{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;padding:14px 10px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;color:var(--ink);min-width:0}
.otext{font-size:1.06rem;line-height:1.4;overflow-wrap:anywhere;min-width:0}
.bubble{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--brand);display:grid;place-items:center;font-family:var(--display);font-size:.78rem;font-weight:700;color:var(--brand)}
button.opt:not(:disabled):hover{background:var(--surface-2)}
.opt:disabled{cursor:default}
.opt.sel{background:var(--brand-soft)}
.opt.sel .bubble{background:var(--brand);color:var(--on-brand)}
.opt.right{background:var(--good-soft)}
.opt.right .bubble{background:var(--good);border-color:var(--good);color:var(--bg)}
.opt.wrong{background:var(--accent-soft)}
.opt.wrong .bubble{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tag{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tag.good{color:var(--good)} .tag.bad{color:var(--accent)}
.fb{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:14px 16px;border-radius:14px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--accent-soft)}
.fb .ico{width:22px;height:22px;margin-top:1px}
.fb.good .ico,.fb.good b{color:var(--good)} .fb.bad .ico,.fb.bad b{color:var(--accent)}
.fb b{display:block;font-family:var(--display);font-weight:700}
.fb p{margin:2px 0 0;line-height:1.55;overflow-wrap:anywhere}
.fb>div{min-width:0}
.work{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.work span{display:block;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.work p{margin:2px 0 0;line-height:1.55;overflow-wrap:anywhere}
.ctx{margin:0;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:.95rem;line-height:1.5;color:var(--ink)}
.fig{margin:0;background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:center;overflow-x:auto}
.fig img{display:block;width:100%;max-width:440px;height:auto;border-radius:6px}
.fig svg{display:block;width:100%;max-width:440px;height:auto;color:#0B1F44}
.fillbox{display:flex;gap:8px;flex-wrap:wrap}
.fillin{flex:1 1 200px;min-width:0;height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:1.05rem;font-family:var(--sans);background:var(--surface);color:var(--ink)}
.fillin:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.fillbox .btn{flex:0 0 auto;min-height:52px}
.fillres{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.blank{display:inline-block;width:4.5em;height:1.05em;border-bottom:2px solid var(--brand);vertical-align:-0.1em;margin:0 .15em}
.qa-seg{align-self:stretch;display:grid;grid-template-columns:1fr 1fr}
.qa-seg button{padding:10px 8px;font-size:.82rem}
.reveal{align-self:flex-start;border:1px dashed var(--brand);color:var(--brand);background:transparent;border-radius:10px;padding:8px 14px;font-weight:700;font-size:.875rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.cell{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--display);font-weight:600;font-size:.88rem;font-variant-numeric:tabular-nums}
.cell.done{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.cell.cur{border:2px solid var(--accent)}
.legend{display:inline-flex;gap:12px;text-transform:none;letter-spacing:0;font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.lg.done{background:var(--brand);border-color:var(--brand)}

.bbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-top:10px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.bbar-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bbar-in.two{grid-template-columns:1fr 2fr}
.bb{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--display);font-weight:700;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:4px}
.bb:disabled{opacity:.4;cursor:default}
.bb.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.bb.submit{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.dlg{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding-top:24px;padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
.dlg-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-family:var(--display);font-size:1.3rem}
.dlg p{margin:0;color:var(--muted)}

.result{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.result>div{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:4px}
.ring{width:124px;height:124px;flex:none}
.ring circle{fill:none;stroke-width:10}
.ring-bg{stroke:var(--surface-2)}
.ring-fg{stroke-linecap:round}
.ring-fg.good{stroke:var(--brand)} .ring-fg.bad{stroke:var(--accent)}
.ring-pct{font:700 26px var(--display);fill:var(--ink);text-anchor:middle}
.ring-sub{font:600 11px var(--sans);fill:var(--muted);text-anchor:middle}
.verdict{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:700;font-size:.75rem;color:var(--muted);letter-spacing:0;text-transform:none}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.items{display:flex;flex-direction:column}
.item{display:flex;flex-direction:column;gap:12px;padding:20px 0;border-bottom:1px solid var(--line)}
.item:first-child{padding-top:6px}
.status{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.status.good{color:var(--good)} .status.bad{color:var(--accent)} .status.none{color:var(--muted)}
.bd{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:0;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.bd>div{background:var(--surface);padding:12px 14px;min-width:0;display:flex;flex-direction:column}
.bd dt{font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bd dd{margin:3px 0 0;font-family:var(--display);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.bd dd.good{color:var(--good)} .bd dd.bad{color:var(--accent)}
.bd span{font-size:.7rem;color:var(--muted)}
.sbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface-2)}

  .oy-orb.o2{animation:oyOrb2 17s ease-in-out infinite}
  .oy-orb.o3{animation:oyOrb3 15s ease-in-out infinite}
  .oy-bg div{animation:oyRow 30s linear infinite}
  .oy-bg div:nth-child(even){animation-duration:38s;animation-direction:reverse}
  .oy-card{animation:oyCard 1s .1s cubic-bezier(.22,1,.36,1) both}
  .oy-note{animation:oyRise .7s .3s both}
  .oy-card::after{animation:oyShine 2.4s 1.4s ease-in-out}
  .oy-photo{animation:oyPhoto 1.1s .4s cubic-bezier(.22,1,.36,1) both}

/* ballot idle animation: says "I'm here, drop the badge in" */
.ballot .b-ring{position:absolute;left:50%;top:24px;width:84px;height:54px;margin-left:-42px;border-radius:14px;border:2px solid var(--accent);opacity:0;pointer-events:none}
@keyframes bFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bWiggle{0%,62%,100%{transform:rotate(0)}66%{transform:rotate(-7deg)}72%{transform:rotate(6deg)}78%{transform:rotate(-4deg)}84%{transform:rotate(2deg)}}
@keyframes bPaper{0%,55%,100%{transform:translateY(0)}65%{transform:translateY(12px)}75%{transform:translateY(-4px)}85%{transform:translateY(0)}}
@keyframes bRing{0%{opacity:.75;transform:scale(.9)}70%,100%{opacity:0;transform:scale(1.35)}}
@keyframes bHint{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion: no-preference){
  .ballot:not(.voted){animation:bFloat 3s ease-in-out infinite}
  .ballot:not(.voted) svg{animation:bWiggle 3.6s ease-in-out infinite;transform-origin:50% 90%}
  .ballot:not(.voted) .b-paper{animation:bPaper 3.6s cubic-bezier(.22,1,.36,1) infinite}
  .ballot:not(.voted) .b-ring{animation:bRing 2.4s ease-out infinite}
  .ballot:not(.voted) .b-hint{animation:bHint 1.8s ease-in-out infinite;background:var(--accent);color:#FFFFFF;border-color:var(--accent)}
  .ballot.voted{animation:bFloat 5s ease-in-out infinite}
  .ballot.hot,.ballot.hot svg,.ballot.hot .b-paper{animation:none}
}
/* ballot box */
.ballot{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:4;width:96px;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;transition:transform .45s cubic-bezier(.22,1,.36,1),filter .45s ease}
.ballot svg{width:88px;height:80px;display:block;overflow:visible;filter:drop-shadow(0 8px 16px rgba(11,42,91,.25))}
.ballot .b-body{fill:#0B2A5B;stroke:#C8102E;stroke-width:2.5}
.ballot .b-paper{transition:transform .45s cubic-bezier(.22,1,.36,1)}
.ballot .b-hint{font-family:var(--display);font-size:.7rem;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.ballot.voted .b-hint{display:none}
.ballot .b-done{display:none;font-family:var(--display);font-size:.7rem;font-weight:800;color:#FFFFFF;background:var(--good);border-radius:999px;padding:2px 9px;white-space:nowrap}
.ballot.voted .b-done{display:inline-block}
.ballot.hot{transform:scale(1.14) translateY(-4px)}
.ballot.hot .b-paper{transform:translateY(-8px)}
.ballot.hot svg{filter:drop-shadow(0 0 18px rgba(200,16,46,.55))}
.b-count{position:absolute;top:18px;right:0;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--accent);color:#FFFFFF;font-family:var(--display);font-weight:800;font-size:.8rem;display:grid;place-items:center;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:1}
.vtoast{position:fixed;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 112px);z-index:7;transform:translateX(-50%) translateY(20px);opacity:0;width:max-content;max-width:calc(100vw - 32px);padding:12px 16px;border-radius:16px;font-size:.88rem;font-weight:600;text-align:center;color:var(--ink);background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(231,237,246,.4));-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px rgba(11,42,91,.2);transition:opacity .45s ease,transform .45s cubic-bezier(.22,1,.36,1)}
.vtoast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.vtoast b{color:var(--brand)} .vtoast .oy{color:var(--accent);font-weight:800}
:root.force-dark .vtoast,:root[data-theme="dark"]:not(.force-light) .vtoast{background:rgba(17,23,37,.75);border-color:rgba(255,255,255,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not(.force-light) .vtoast{background:rgba(17,23,37,.75);border-color:rgba(255,255,255,.18)}}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.22) rotate(-4deg)}55%{transform:scale(.94) rotate(3deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: no-preference){.ballot.bump{animation:bump .7s cubic-bezier(.22,1,.36,1)}}
body:not(.no-float):not(.in-session) .page{padding-bottom:160px}
body.in-session .ballot,body.no-float .ballot,body.in-session .vtoast,body.no-float .vtoast{display:none}

const RAW_MTH103 = [
["At what ratio is the point (4b − 2a, 9c − a) divided by the line joining the points (a + b, 3c + 5a) and (5b − 3a, 11c − 3a)?",["(a − b) : (b − a)","3 : 1","2 : 3","1 : 3"],"B","Let the ratio be k : 1. x: (a+b) + k(5b−3a) = (1+k)(4b−2a) ⇒ (a−b)(3−k) = 0 ⇒ k = 3. y-check: [3c+5a + 3(11c−3a)]/4 = 9c − a ✓. Ratio 3 : 1."],
["Evaluate |(A + B)·(A − B)| if A = 2i − 3j + 5k and B = 3i + j − 2k.",["34","18","24","−8"],"C","A+B = 5i − 2j + 3k, A−B = −i − 4j + 7k. Dot product = −5 + 8 + 21 = 24."],
["Determine the work done by a force F = (2i − 5j + 4k) newtons acting at a point on a body, when A(2, 5, −3) is displaced to point B(1, −3, 0).",["50 J","15 J","45 J","54 J"],"A","Displacement d = B − A = −i − 8j + 3k. W = F·d = −2 + 40 + 12 = 50 J."],
["A point C moves so that its distance from two fixed points A(5, 3) and B(7, 4) is always equal. Find the equation of the locus of C.",["2x + 4y = 31","4x + 2y = 31","2x + 2y = 62","8x + 4y = 31"],"B","(x−5)² + (y−3)² = (x−7)² + (y−4)² ⇒ −10x − 6y + 34 = −14x − 8y + 65 ⇒ 4x + 2y = 31."],
["Find the vector equation of the straight line joining A(5, 2, 6) and B(−3, 6, 2).",["(5 + 2α, 2 − α, 6 + α)","(3 + 5α, 3 − α, 6 − 2α)","(5 − α, 1 + 2α, 6 + α)","(5 − 2α, 2 + α, 6 − α)"],"D","Direction AB = (−8, 4, −4) ∥ (−2, 1, −1). r = (5 − 2α, 2 + α, 6 − α)."],
["Find the equations of the tangents to the ellipse 4x² + 5y² = 20 which are parallel to the line 2y − 6x = 7.",["y = 7x ± 3","y = x ± 1","y = 2x ± 3","y = 3x ± 7"],"D","Ellipse x²/5 + y²/4 = 1; the line has slope m = 3. Tangent: y = mx ± √(a²m² + b²) = 3x ± √(45 + 4) = 3x ± 7."],
["Find the equation of the plane containing the point A with position vector a = i + 5j + 3k and perpendicular to the vector 2i + 3j + 6k.",["x + y + z = 18","2x − y − z = 15","2x + 3y + 6z = 35","x + 3y − 2z = 15"],"C","r·n = a·n: 2x + 3y + 6z = 2(1) + 3(5) + 6(3) = 35."],
["Find the equation of the tangent line to the parabola y² = 4px at the point (x₀, y₀).",["y² = 2px²","2y² = 2px²","2p(y − y₀) = −y₀(x − x₀)","yy₀ = 2p(x + x₀)"],"D","2yy′ = 4p ⇒ slope 2p/y₀. y − y₀ = (2p/y₀)(x − x₀) ⇒ yy₀ − y₀² = 2px − 2px₀. Using y₀² = 4px₀: yy₀ = 2p(x + x₀)."],
["A force of (2i − j + k) newtons acts on a line through point P having coordinates (0, 3, 1) metres. Determine the moment vector about point Q having coordinates (4, 0, −1) metres.",["7.46 J","9.64 J","3.76 J","4.49 J"],"B","r = P − Q = (−4, 3, 2). M = r × F = (5, 8, −2). |M| = √(25 + 64 + 4) = √93 ≈ 9.64."],
["Find the equation of the circle with centre (7, −6) which touches the line 3x − 4y + 5 = 0.",["(x + 7)² + (y − 6)² = 10²","(x − 7)² + (y − 6)² = 4²","(x − 7)² + (y + 6)² = 10²","(x + 6)² + (y − 6)² = 10²"],"C","Radius = distance from (7, −6) to the line = |21 + 24 + 5|/5 = 10. So (x − 7)² + (y + 6)² = 10²."],
["What is the vertex of the parabola x² − 2x + 8y + 9 = 0?",["(−1, −1)","(1, −1)","(−1, 1)","(1, 1)"],"B","(x − 1)² = −8y − 8 = −8(y + 1). Vertex (1, −1)."],
["What is the nature of the graph of the equation 6x² − 9y² − 8x − 36y − 69 = 0?",["Parabola","Hyperbola","Circle","Ellipse"],"B","The x² and y² coefficients have opposite signs (6 and −9), so it is a hyperbola."],
["The position vectors of U, V and W are respectively u = (12i + 8j + k), v = (3i + 2j − 5k) and w = (−3i − 2j + βk). Find the value of β for which W and UV are parallel.",["−2","−9","−3","6"],"A","UV = v − u = (−9, −6, −6) = 3(−3, −2, −2). For W ∥ UV, β = −2."],
["If the points A(5, 6), P(x, y) and B(2, 3) are collinear, express x in terms of y.",["x = y − 1","y = x − 1","x = 2y − 1","x = y − 2"],"A","Slope AB = (6 − 3)/(5 − 2) = 1, so y − 3 = x − 2 ⇒ x = y − 1."],
["If r₁ = r₂, where the lines are r₁ = (2i + 2j − 4k) + t(i + 3j − 3k) and r₂ = (i + j + k) + s(i + 2j − 4k), find t and s.",["−1, −3","3, −2","1, 2","1, −3"],"C","2 + t = 1 + s and 2 + 3t = 1 + 2s ⇒ t = 1, s = 2. z-check: −4 − 3 = 1 − 8 = −7 ✓."],
["If a = 2i − j + k and b = i + 2j − 3k, find |(2a + b) × (a − 2b)|.",["5√3","15√5","25√3","5√5"],"C","2a + b = (5, 0, −1), a − 2b = (0, −5, 7). Cross product = (−5, −35, −25). Magnitude = √1875 = 25√3."],
["Given the vectors a = 4i − 2j + 3k and b = 5i + j − 4k, find the area of the parallelogram enclosed by a and b.",["√1321","√513","√1182","√117"],"C","a × b = (5, 31, 14). Area = |a × b| = √(25 + 961 + 196) = √1182."],
["Given that a = 8 − 2t², and when t = 0, v = 0 and s = 0, find the distance covered by the particle in the first 2 seconds of its motion.",["10⅔","11⅓","13⅓","17⅓"],"C","v = 8t − 2t³/3, s = 4t² − t⁴/6. At t = 2: s = 16 − 16/6 = 13⅓. (v stays positive, so the particle never turns back.)"],
["Find the locus of the point P which moves so that the sum of its distances from two fixed points A and B, 8 units apart, is always 14 units. Take AB and its perpendicular bisector as the axes x and y respectively.",["x²/49 + y²/33","x²/7 + y²/11","x²/33 + y²/49","x²/39 + y²/43"],"A","Ellipse: 2a = 14 ⇒ a = 7; foci 8 apart ⇒ c = 4; b² = 49 − 16 = 33. x²/49 + y²/33 = 1."],
["Given the scalar field defined by θ(x, y, z) = 3x²z − xy³ + 5, find θ(1, −2, 2).",["−7","9","17","19"],"D","3(1)²(2) − (1)(−2)³ + 5 = 6 + 8 + 5 = 19."],
["The ends of a line segment are (p − q, p + q) and (p + q, p − q). Find the coordinates of its mid-point.",["(2p, p)","(p, q)","(p, p)","(q, −2p)"],"C","((p − q + p + q)/2, (p + q + p − q)/2) = (p, p)."],
["The ends of a line segment are (p − q, p + q) and (p + q, p − q). Find the length of the line segment.",["2p√3","3q√2","2q√2","2pq√2"],"C","Δx = 2q, Δy = −2q. Length = √(8q²) = 2q√2."],
["Find the equation of the normal to the hyperbola 9x² − 4y² = 36 at the point (4, 3√3).",["3y = −√3x + 13√3","3y = √3x + 3√3","y = √3x − √3","2y = −√3x + 13√2"],"A","18x − 8yy′ = 0 ⇒ y′ = 9x/(4y) = 36/(12√3) = √3. Normal slope −1/√3: y − 3√3 = −(x − 4)/√3 ⇒ 3y = −√3x + 13√3."],
["Find the equation of the tangent at any point on the parabola x = 6t, y = 3t².",["2tx² + 2tx + 4y = 0","tx + 2y − 31 = 0","tx + 2y = 62","3t² − tx + y = 0"],"D","dy/dx = (dy/dt)/(dx/dt) = 6t/6 = t. y − 3t² = t(x − 6t) ⇒ y = tx − 3t², i.e. 3t² − tx + y = 0."],
["Find the area of the triangle with vertices at P(2, 3, 5), Q(4, 2, −1) and R(3, 6, 4).",["√1183","√113","½√426","½√413"],"C","PQ = (2, −1, −6), PR = (1, 3, −1). PQ × PR = (19, −4, 7), magnitude √426. Area = ½√426."],
["Find the asymptote of the hyperbola 9x² − 4y² = 36.",["y = ±7x − 3","y = ±(2/3)x","y = ±(3/2)x","y = ±3x − 7"],"C","x²/4 − y²/9 = 1, so a = 2, b = 3. Asymptotes y = ±(b/a)x = ±(3/2)x."],
["Find a unit vector perpendicular to the plane of the vectors P = 3i − 2j + 4k and Q = i + j − 2k.",["±(1/6)(i − 2j + k)","±(1/√5)(2j + k)","±(1/√3)(2i − j + 3k)","±(1/5)(−2j + 3k)"],"B","P × Q = (0, 10, 5) = 5(0, 2, 1). Unit vector ±(2j + k)/√5."],
["An ellipse has eccentricity e = 4/5 and its foci are the points (0, ±4). Write its equation.",["x²/25 + y²/9","x²/9 + y²/25","x²/3 + y²/5","x²/5 + y²/25"],"B","Foci on the y-axis, c = 4, e = c/a ⇒ a = 5; b² = 25 − 16 = 9. x²/9 + y²/25 = 1."],
["The graph of the equation x² + 2y² = 8 is",["a circle","an ellipse","a hyperbola","a parabola"],"B","x²/8 + y²/4 = 1: both squares positive with different denominators ⇒ ellipse."],
["The eccentricity of an ellipse is √(2/5) and it passes through the point (−3, 1). Its equation is",["3x² + 5y² = 32","2x² + 3y² = 33","3x² + 4y² = 30","2x² + 3y² = 34"],"A","e² = 1 − b²/a² = 2/5 ⇒ b² = 3a²/5, so the ellipse has the form 3x² + 5y² = k. Through (−3, 1): k = 27 + 5 = 32."],

["The eccentricity e of the ellipse 2x² + 3y² = 1 is",["−1/√3","1/√2","1/√3","2/√3"],"C","x²/(1/2) + y²/(1/3) = 1. e² = 1 − (1/3)/(1/2) = 1/3 ⇒ e = 1/√3."],

["Which of the following statement(s) is/are correct about the electric force of attraction/repulsion between two charges? I. It is directly proportional to the product of the magnitude of the charges. II. It is inversely proportional to the distance between the charges.",["I only","II only","I and II","Neither I nor II"],"A","Coulomb's law F = kq₁q₂/r². I is true. II is false: the force is inversely proportional to the square of the distance."],
["The electron and proton of a hydrogen atom are separated by a distance of 5.3 × 10⁻¹¹ m. Find the magnitude of the electric force between the two particles.",["4.35 × 10⁻¹⁸ N","5.13 × 10⁻¹¹ N","8.2 × 10⁻⁸ N","2.72 × 10⁻¹ N"],"C","F = ke²/r² = 8.99 × 10⁹ × (1.6 × 10⁻¹⁹)² / (5.3 × 10⁻¹¹)² = 8.2 × 10⁻⁸ N."],
["Four identical resistors, rated 3 ohms, are used in a circuit. What is the total resistance in the circuit if the resistors are connected in parallel?",["1.33 Ω","12.00 Ω","0.75 Ω","3.00 Ω"],"C","n identical resistors in parallel: R/n = 3/4 = 0.75 Ω."],
["Find the resultant force exerted on q₂.",["0","(−16.2 î + 16.2 ĵ) N","(16.2 î + 16.2 ĵ) N","(16.2 î − 16.2 ĵ) N"],"D","q₂ (−3 µC) is attracted to both positive charges. Each force has size k(6 µC)(3 µC)/a² = 8.99 × 10⁹ × 18 × 10⁻¹²/0.01 = 16.2 N: towards q₃ (+î) and down towards q₁ (−ĵ). F = (16.2 î − 16.2 ĵ) N.",{ctx:"Three point charges sit at the corners of a right-angle triangle as shown, where q₁ = q₃ = 6.0 µC, q₂ = −3.0 µC and a = 0.10 m.",fig:'tri'}],
["Find the magnitude of the resultant force exerted on q₃.",["18.00 N","3.00 N","12.40 N","16.20 N"],"C","From q₂: 16.2 N attraction, pointing −î. From q₁ (distance √2a): k(36 × 10⁻¹²)/0.02 = 16.2 N repulsion along the diagonal, components (11.4, 11.4). Net: Fx = 11.4 − 16.2 = −4.7 N, Fy = 11.4 N. |F| = √(4.7² + 11.4²) ≈ 12.4 N.",{ctx:"Three point charges sit at the corners of a right-angle triangle as shown, where q₁ = q₃ = 6.0 µC, q₂ = −3.0 µC and a = 0.10 m.",fig:'tri'}],
["Find their electric potential energy.",["−16.20 J","−0.95 J","55.31 J","48.60 J"],"B","U = k[q₁q₂/a + q₂q₃/a + q₁q₃/(√2a)] = 8.99 × 10⁹ × [−1.8 × 10⁻¹⁰ − 1.8 × 10⁻¹⁰ + 2.55 × 10⁻¹⁰] ≈ −0.95 J.",{ctx:"Three point charges sit at the corners of a right-angle triangle as shown, where q₁ = q₃ = 6.0 µC, q₂ = −3.0 µC and a = 0.10 m.",fig:'tri'}],
["What is the value of I₃?",["1.62 A","3.58 A","1.96 A","0.34 A"],"B","Right loop: 12 = 3I₂ + 2I₃, and the junction rule gives I₃ = I₁ + I₂. Only I₃ ≈ 3.58 A fits: then 3I₂ = 12 − 7.16 ⇒ I₂ ≈ 1.62 A and I₁ ≈ 1.96 A. (The left side of the figure is cut off in the original paper.)",{ctx:"Currents I₁, I₂ and I₃ flow through resistors R₁, R₂ (3 Ω) and R₃ (2 Ω) respectively, with a 12 V cell on the right.",fig:'kirch',alt:'Two-loop circuit: R1 on the left, R3 = 2 Ω in the middle branch, R2 = 3 Ω and a 12 V cell on the right.'}],
["What is the voltage drop across resistor R₂?",["4.86 V","10.74 V","5.88 V","1.02 V"],"A","From the right loop, V(R₂) = 12 − 2I₃ = 12 − 2(3.57) ≈ 4.86 V, i.e. I₂ = 1.62 A through 3 Ω.",{ctx:"Currents I₁, I₂ and I₃ flow through resistors R₁, R₂ (3 Ω) and R₃ (2 Ω) respectively, with a 12 V cell on the right.",fig:'kirch',alt:'Two-loop circuit: R1 on the left, R3 = 2 Ω in the middle branch, R2 = 3 Ω and a 12 V cell on the right.'}],
["Two long straight parallel wires separated by 60 cm carry currents of 3 A (wire A) and 6 A (wire B) along the same direction in free space. At which point between the wires will the net magnetic field be zero?",["20 cm from A","20 cm from B","Midway between both wires","15 cm from B"],"A","Fields cancel where I_A/x = I_B/(60 − x): 3/x = 6/(60 − x) ⇒ x = 20 cm from A (nearer the smaller current)."],
["A series AC circuit consists of a 30 ohms resistance, a 40 mH inductance and a 50 µF capacitance connected to a 240 V 50 Hz power source. Calculate the current in the circuit.",["2.26 A","4.05 A","8.00 A","11.00 A"],"B","X_L = 2π(50)(0.04) = 12.57 Ω; X_C = 1/(2π × 50 × 50 × 10⁻⁶) = 63.66 Ω. Z = √(30² + 51.09²) = 59.25 Ω. I = 240/59.25 = 4.05 A."],
["For the series AC circuit with 30 Ω resistance, 40 mH inductance and 50 µF capacitance on a 240 V, 50 Hz supply, what is the power dissipated in the circuit?",["492.075 W","971.875 W","1920 W","153.228 W"],"A","Only the resistor dissipates power: P = I²R = (4.05)² × 30 = 492.075 W."],
["A transformer whose primary winding has 50 turns is to step up a voltage of 110 V to 1980 V. Find the current drawn from the voltage source when a resistive load of 22000 ohms is connected across the secondary.",["1.62 A","90 mA","5 mA","3 A"],"A","Is = 1980/22000 = 0.09 A. Power balance: Ip = Is × Vs/Vp = 0.09 × 1980/110 = 1.62 A."],
["Three resistors with values 30 ohms, 45 ohms and 18 ohms are connected (in series) across a DC power supply of 25 V. Calculate the potential difference across the 45 ohms resistor.",["12.10 V","4.84 V","8.06 V","15.23 V"],"A","Total 93 Ω, I = 25/93 = 0.269 A. V = 0.269 × 45 = 12.10 V."],
["What chief form of energy conversion occurs in the AC motor?",["Mechanical - Electrical","Thermal - Electrical","Electrical - Mechanical","Electrical - Thermal"],"C","A motor converts electrical energy into mechanical energy (a generator does the reverse)."],
["To produce a current in a coil linked with a magnetic field, one or all of the following changes must occur except",["change in the magnetic field strength","change in the area of the coil","change in the resistance of the coil","change in orientation of the coil relative to the magnetic field"],"C","Flux Φ = BA cos θ changes with B, A or θ. Resistance does not change the flux."],
["An electron with an initial velocity of 60000 î m/s is launched into a magnetic field of strength 48 ĵ T. The magnitude of the linear acceleration experienced by the electron is?",["5.06 × 10¹⁷ m/s²","7.11 × 10⁸ m/s²","1.2 × 10³ m/s²","Zero"],"A","F = qvB (v ⊥ B). a = qvB/m = 1.6 × 10⁻¹⁹ × 6 × 10⁴ × 48 / 9.11 × 10⁻³¹ = 5.06 × 10¹⁷ m/s²."],
["Ferromagnetic materials include the following except",["Ni","Pb","Fe","Gd"],"B","Nickel, iron and gadolinium are ferromagnetic. Lead (Pb) is diamagnetic."],
["The direction of an induced current can gotten via which rule/law?",["Fleming's Left Hand rule","Faraday's law","Lenz's law","Lorentz rule"],"C","Lenz's law gives the direction: the induced current opposes the change in flux. Faraday's law gives the size."],
["Which is the effective working voltage in an AC voltage supply",["peak voltage","peak-to-peak voltage","root-mean-square voltage","average voltage"],"C","The rms voltage is the effective value: it gives the same heating as that DC voltage."],
["A circular loop of wire with a radius of 12.0 cm and oriented in the horizontal xy-plane is located in a region of uniform magnetic field. A field of 1.5 T is directed along the positive z-direction. If the loop is removed from the region in a time interval of 2.0 ms, find the average emf that will be induced in the wire loop during the extraction process.",["34 V","78 V","67 V","28 V"],"A","Φ = BA = 1.5 × π(0.12)² = 0.0679 Wb. emf = ΔΦ/Δt = 0.0679/0.002 ≈ 34 V."],
["Energy losses in a transformer include the following except",["Eddy Current Loss","I²R loss","Hysteresis loss","Transformation loss"],"D","Real losses are eddy currents, copper (I²R) loss, hysteresis and flux leakage. “Transformation loss” is not a recognised loss."],
["To convert a galvanometer to an ammeter, which of the following must be introduced (connection is to the galvanometer)",["High resistance, connected in series","low resistance, connected in parallel","low resistance, connected in series","high resistance, connected in parallel"],"B","An ammeter needs a low-resistance shunt in parallel. (A voltmeter uses a high resistance in series.)"],
["A circular coil 0.05 m in radius, with 30 turns of wire, lies in a horizontal plane. It carries a current of 5 A. The coil is in a uniform 1.20 T magnetic field directed toward the right. Find the magnitude of the torque on the coil.",["3.89 N.m","1.41 N.m","4.02 N.m","9.78 N.m"],"B","The field lies in the coil's plane, so θ = 90° between B and the normal. τ = NIAB = 30 × 5 × π(0.05)² × 1.2 = 1.41 N·m."],
["Determine the current flow through R₁.",["0.0411 A","6.1650 A","0.0247 A","0.0658 A"],"C","Take the bottom of B2 as 0 V and let V be the node above R8. KCL: (12 − V)/20 = (V − 6)/190 + V/260 ⇒ V = 10.69 V. Current in R₁ (and R₇) = (10.69 − 6)/190 = 0.0247 A.",{ctx:"Refer to the circuit: B1 = 6 V, B2 = 12 V, R1 = 40 Ω, R2 = 150 Ω, R3 = 80 Ω, R4 = 100 Ω, R5 = 20 Ω, R6 = 60 Ω, R7 = 150 Ω, R8 = 20 Ω.",fig:'multi',alt:'Three-loop circuit with batteries B1 6 V and B2 12 V and resistors R1 to R8.'}],
["Calculate the voltage drop across R₂.",["0.0411 V","6.1650 V","0.0247 V","0.0658 V"],"B","The right branch is R₂ + (R₄ ∥ (R₃ + R₅)) + R₆ = 150 + 50 + 60 = 260 Ω, carrying 10.69/260 = 0.0411 A. V(R₂) = 0.0411 × 150 = 6.165 V.",{ctx:"Refer to the circuit: B1 = 6 V, B2 = 12 V, R1 = 40 Ω, R2 = 150 Ω, R3 = 80 Ω, R4 = 100 Ω, R5 = 20 Ω, R6 = 60 Ω, R7 = 150 Ω, R8 = 20 Ω.",fig:'multi',alt:'Three-loop circuit with batteries B1 6 V and B2 12 V and resistors R1 to R8.'}],
["Determine the current flow through R₃.",["0.0411 A","2.0550 A","0.0206 A","0.0422 A"],"C","The 0.0411 A splits between R₄ (100 Ω) and R₃ + R₅ (100 Ω) equally: 0.0206 A through R₃.",{ctx:"Refer to the circuit: B1 = 6 V, B2 = 12 V, R1 = 40 Ω, R2 = 150 Ω, R3 = 80 Ω, R4 = 100 Ω, R5 = 20 Ω, R6 = 60 Ω, R7 = 150 Ω, R8 = 20 Ω.",fig:'multi',alt:'Three-loop circuit with batteries B1 6 V and B2 12 V and resistors R1 to R8.'}],
["What is the power dissipated by R₄?",["0.0411 W","2.0550 W","0.0206 W","0.0422 W"],"D","R₄ carries 0.02055 A. P = I²R = (0.02055)² × 100 = 0.0422 W.",{ctx:"Refer to the circuit: B1 = 6 V, B2 = 12 V, R1 = 40 Ω, R2 = 150 Ω, R3 = 80 Ω, R4 = 100 Ω, R5 = 20 Ω, R6 = 60 Ω, R7 = 150 Ω, R8 = 20 Ω.",fig:'multi',alt:'Three-loop circuit with batteries B1 6 V and B2 12 V and resistors R1 to R8.'}],
["Which of the following statements is/are TRUE? I. The current flow through R₂ is greater than that of R₃. II. The voltage drop across R₃ is lesser than that of R₄.",["I only","II only","I and II","Neither I nor II"],"C","I: 0.0411 A > 0.0206 A, true. II: V(R₃) = 0.0206 × 80 = 1.64 V and V(R₄) = 0.0206 × 100 = 2.06 V, so true.",{ctx:"Refer to the circuit: B1 = 6 V, B2 = 12 V, R1 = 40 Ω, R2 = 150 Ω, R3 = 80 Ω, R4 = 100 Ω, R5 = 20 Ω, R6 = 60 Ω, R7 = 150 Ω, R8 = 20 Ω.",fig:'multi',alt:'Three-loop circuit with batteries B1 6 V and B2 12 V and resistors R1 to R8.'}],
["In a motor, a conductor of length 115 mm carries a current of 3 A and lies perpendicularly to a uniform magnetic field of 1.3 T. If the conductor is 60 mm from the axis of the motor and is parallel to it, calculate the torque that is produced.",["448.5 × 10⁻³ Nm","7.5 × 10⁻³ Nm","35.1 × 10⁻³ Nm","26.9 × 10⁻³ Nm"],"D","F = BIL = 1.3 × 3 × 0.115 = 0.4485 N. τ = F × r = 0.4485 × 0.060 = 26.9 × 10⁻³ N·m."],
["Which of these are TRUE about electric lines of force? I. they may cross/intersect under extreme conditions II. The direction of the field at a point is along their tangent. III. The field strength is proportional to their density. IV. they starts and ends in mid-space",["I, II and III","I and II","II and III","II and IV"],"C","Field lines never cross and they start on positive and end on negative charges. II and III are true."],
["The magnetic field perpendicular to a 4 cm² area 50-loop coil is changing in the following way: B = 170 − 0.50t mT, with t in seconds. Calculate the induced emf in the coil.",["114.9 V","68.0 µV","10.0 µV","118.2 mV"],"C","emf = NA |dB/dt| = 50 × 4 × 10⁻⁴ × 0.50 × 10⁻³ = 1.0 × 10⁻⁵ V = 10.0 µV."],
["The current in a circuit, changes from 22 A to zero in 6 ms. If the average induced emf is 280 V, calculate the coefficient of self-inductance of the circuit.",["12.8 mH","76.9 mH","76.4 mH","75.7 mH"],"C","emf = L ΔI/Δt ⇒ L = 280 × 0.006/22 = 0.0764 H = 76.4 mH."],
["A generator develops an emf of 120 V and has a terminal potential difference of 110 V when the armature current is 24 A. Determine the resistance of the armature.",["0.64 Ω","0.42 Ω","0.20 Ω","1.01 Ω"],"B","E = V + Ir ⇒ r = (120 − 110)/24 = 0.42 Ω."],
["A motor running at full load on a 110 V line develops a back emf of 105 V and draws a current of 5 A through the armature. Calculate the mechanical power output of the motor, disregarding frictional losses.",["1075 W","550 W","525 W","25 W"],"C","Mechanical power = back emf × current = 105 × 5 = 525 W. (550 W is the input; 25 W is lost as heat.)"],
["Which of the following conditions must hold for current to be induced in a wire loop?",["The loop's plane must be perpendicular to the magnetic field","The magnetic flux through the loop must vary with time","The loop's plane must be parallel to the magnetic field","There must be a large magnetic flux through the loop."],"B","Faraday's law: only a time-varying flux induces an emf and current."],
["Which of the following voltages is larger for a sinusoidal ac voltage?",["Vrms (effective voltage)","V₀ (peak voltage)","V₀ and Vrms have the same value","V₀/2"],"B","V₀ = √2 × Vrms, so the peak voltage is larger."],
["An ac generator produces an output voltage, ε = 130 sin 379t V, where t is in seconds. Calculate the frequency of the ac voltage.",["60.3 Hz","117.7 Hz","130.0 Hz","42.3 Hz"],"A","ω = 379 rad/s ⇒ f = ω/2π = 379/6.283 = 60.3 Hz."],
["Which of the following statements is correct about stationary electric charges? I. they have electric field II. they have magnetic field",["I only","II only","I and II","neither I nor II"],"A","All charges have an electric field; only moving charges produce a magnetic field."],
["The deflection arm of a gold-leaf electroscope rose to form an angle θ when it acquired a net positive charge. When a positively charged rod is brought close to the disk of the electroscope, the angle θ will ______",["increase","decrease","remain unchanged","become random"],"A","The positive rod repels positive charge down onto the leaves (pulls electrons up to the disk), so the leaves diverge more."],
["Which of the following statements about an ideal transformer is correct?",["It must increase or decrease the energy supplied to it","It changes the voltage applied to it by induction","A step-up transformer usually increases the energy supplied to it","None of the above"],"B","A transformer works by mutual induction and changes voltage. It cannot create energy: power in = power out."],
["A charged particle with a mass of 10 mg and a charge of +2 µC is released in a uniform electric field. If the acceleration experienced by the particle is 50 m/s², what is the magnitude of the electric field?",["1.0 × 10⁻⁴ N/C","2.5 × 10⁵ N/C","1.0 × 10⁻² N/C","4.0 × 10⁻¹⁰ N/C"],"B","E = ma/q. The intended answer, 2.5 × 10⁵ N/C, uses m = 10 g: 0.01 × 50 / 2 × 10⁻⁶. (With m = 10 mg exactly, E = 250 N/C, which is not listed.)"],
["Which of the following is/are true? I. The magnitude of electric force depends on the electric field strength II. Stationary electric charges possess electric field and magnetic field III. The magnetic force on a moving charged particle acts along the direction of the magnetic field",["I and III only","I and II only","I only","I, II and III"],"C","I: F = qE, true. II: stationary charges have no magnetic field. III: the magnetic force is perpendicular to B. Only I."],
["Which of the following is/are unit(s) of magnetic flux?",["T.m²","Wb","both options A and B","T.m/A"],"C","Φ = BA, so its unit is T·m², which is called the weber (Wb)."],
["The force of attraction between two point charges, separated by 10 metres, is 96.48 N. What will be the force of attraction, when the point charges are separated by 5 metres?",["24.12 N","48.24 N","192.96 N","385.92 N"],"D","F ∝ 1/r². Halving the distance multiplies the force by 4: 96.48 × 4 = 385.92 N."],
["Assuming cell E is ideal, what is the total resistance in the circuit?",["35.3 Ω","36.6 Ω","91.0 Ω","247.0 Ω"],"B","R₂ ∥ (R₃ + R₄) = 40 ∥ 40 = 20 Ω. R₅ ∥ R₆ ∥ R₇: 1/60 + 1/4 + 1/90 = 0.2778 ⇒ 3.6 Ω. Total = 13 + 20 + 3.6 = 36.6 Ω.",{ctx:"Refer to the circuit: E = 12 V, R1 = 13 Ω, R2 = 40 Ω, R3 = 10 Ω, R4 = 30 Ω, R5 = 60 Ω, R6 = 4 Ω, R7 = 90 Ω.",fig:'mixed',alt:'Series-parallel circuit: R2 parallel with R3+R4, then R5, R6, R7 in parallel, R1 = 13 Ω and a 12 V cell E.'}],
["What is the current flowing through Resistor R₃?",["0.295 A","0.328 A","1.181 A","3.000 A"],"B","The total current is 12/36.6 = 0.328 A, which is the intended answer. Strictly, it splits equally between R₂ (40 Ω) and R₃ + R₄ (40 Ω), so R₃ carries 0.164 A, which is not listed.",{ctx:"Refer to the circuit: E = 12 V, R1 = 13 Ω, R2 = 40 Ω, R3 = 10 Ω, R4 = 30 Ω, R5 = 60 Ω, R6 = 4 Ω, R7 = 90 Ω.",fig:'mixed',alt:'Series-parallel circuit with R1 to R7 and a 12 V cell E.'}],
["What is the voltage drop across Resistor R₆?",["0.295 V","0.328 V","1.181 V","12.000 V"],"C","R₅, R₆, R₇ are in parallel (3.6 Ω) and carry the full 0.328 A: V = 0.328 × 3.6 = 1.181 V.",{ctx:"Refer to the circuit: E = 12 V, R1 = 13 Ω, R2 = 40 Ω, R3 = 10 Ω, R4 = 30 Ω, R5 = 60 Ω, R6 = 4 Ω, R7 = 90 Ω.",fig:'mixed',alt:'Series-parallel circuit with R1 to R7 and a 12 V cell E.'}],
["If Resistors R₅ and R₇ are light bulbs with similar efficiencies, which of the following will be true?",["R₅ will be brighter than R₇","R₇ will be brighter than R₅","R₅ and R₇ will have the same brightness","There is no sufficient information to compare the brightness of R₅ with R₇"],"A","R₅ and R₇ are in parallel, so they share the same voltage. P = V²/R, so the smaller resistance (R₅ = 60 Ω) uses more power and is brighter.",{ctx:"Refer to the circuit: E = 12 V, R1 = 13 Ω, R2 = 40 Ω, R3 = 10 Ω, R4 = 30 Ω, R5 = 60 Ω, R6 = 4 Ω, R7 = 90 Ω.",fig:'mixed',alt:'Series-parallel circuit with R1 to R7 and a 12 V cell E.'}],
["A uniform electric field is setup between two parallel conducting plates, with potential difference of 25 V and 50 cm apart. What will be the magnitude of acceleration of an electron released at rest between the plates?",["2.84 × 10⁻¹² m s⁻²","2.84 × 10⁻¹⁰ m s⁻²","8.79 × 10¹⁰ m s⁻²","8.79 × 10¹² m s⁻²"],"D","E = V/d = 25/0.5 = 50 V/m. a = eE/m = 1.6 × 10⁻¹⁹ × 50 / 9.11 × 10⁻³¹ = 8.79 × 10¹² m/s²."],
["What is the magnitude of the electrical force exerted on qT?",["−28.8 N","28.8 N","14.4 N","43.2 N"],"C","Each is 0.05 m from qT. From q₁: k(6)(2) × 10⁻¹²/0.0025 = 43.2 N; from q₂: k(4)(2) × 10⁻¹²/0.0025 = 28.8 N, in opposite directions. Net = 14.4 N.",{ctx:"Point charges q₁ = +6 µC and q₂ = +4 µC are 10 cm apart. A test charge qT = +2 µC is placed halfway between them."}],
["What is the direction of the electrical force exerted on qT?",["Towards q₁","Away from q₁","Perpendicular to q₁ and q₂","It has no direction."],"B","The larger repulsion comes from q₁ (43.2 N vs 28.8 N), so the net force pushes qT away from q₁, towards q₂.",{ctx:"Point charges q₁ = +6 µC and q₂ = +4 µC are 10 cm apart. A test charge qT = +2 µC is placed halfway between them."}],
["What is the total capacitance in the circuit?",["3.0 µF","4.5 µF","9.0 µF","27.0 µF"],"A","4 ∥ 5 = 9 µF; then 9 µF; then 1 ∥ 2 ∥ 6 = 9 µF. Three 9 µF in series: 9/3 = 3.0 µF.",{ctx:"Refer to the capacitor circuit connected to a 12 V supply.",fig:'caps',alt:'4 µF parallel 5 µF, in series with 9 µF, in series with 1 µF, 2 µF and 6 µF in parallel, across 12 V.'}],
["What is the energy stored by the 2 µF capacitor?",["4 × 10⁻⁶ J","8 × 10⁻⁶ J","16 × 10⁻⁶ J","32 × 10⁻⁶ J"],"C","Q = CV = 3 µF × 12 = 36 µC. The 1/2/6 µF group (9 µF) has V = 36/9 = 4 V. Energy = ½CV² = ½ × 2 × 10⁻⁶ × 16 = 16 × 10⁻⁶ J.",{ctx:"Refer to the capacitor circuit connected to a 12 V supply.",fig:'caps',alt:'4 µF parallel 5 µF, in series with 9 µF, in series with 1 µF, 2 µF and 6 µF in parallel, across 12 V.'}]

const RAW_CHM102 = [["Which of the following statement is false?", ["carboxylic acids are stronger acids than the corresponding alcohols", "mineral acids are stronger than carboxylic acids", "methanoic acid is a stronger acid than propanoic acid", "the higher the number of substituents with –I effect, the higher the acidity of the carboxylic acid"], "B", "All four statements are actually true as written. The answer key gives B, so that is the answer marked here."], ["Oxidation of methylethanol (propan-1-ol) with acidified K2Cr2O7 results in?", ["propanal", "propanone", "propanoic acid", "none of the above"], "C", "Propan-1-ol is a primary alcohol. Acidified K₂Cr₂O₇ (in excess) oxidises it to propanal and then on to propanoic acid."], ["Which of the following is TRUE?", ["polymer fullerenes have multiple graphene sheets", "metallofullerenes have 240 carbon atoms", "endohedral fullerenes have 240 carbon atoms", "carbon nanotubes are cylindrical in shape"], "D", "Carbon nanotubes are rolled graphene sheets, so they are cylindrical. The other statements are false."], ["The bonding in fullerenes is?", ["covalent", "electrovalent", "dative", "fused"], "A", "Each carbon in a fullerene shares electron pairs with its neighbours: covalent bonding."], ["This reaction CH3OCH2CH2CH3 + conc. HI in excess acid will yield:", ["C2H5I and IC3H7", "CH3I and IC3H7", "C2H5I and C3H7I", "CH3I and C3H7I"], "D", "Excess HI cleaves the ether at both C–O bonds, and the alcohol formed is converted to iodide too: CH₃I and C₃H₇I."], ["Give the IUPAC name of CH3C(CH3)2CH=CH2", ["2,2-dimethylpropene", "3,3-dimethylbut-1-ene", "2,2-dimethyl-3-butene", "3-dimethylpropene"], "B", "Longest chain containing C=C has 4 carbons, numbered from the double-bond end: but-1-ene with two methyls on C3 → 3,3-dimethylbut-1-ene."], ["The formation of a white precipitate that is soluble in excess NH4OH on addition of dilute HNO3 and AgNO3 to Lassaigne’s filtrate indicates the presence of:", ["bromide", "sulphur", "iodide", "chloride"], "D", "AgCl is a white precipitate that dissolves in excess NH₄OH. AgBr is pale yellow (partly soluble); AgI is yellow (insoluble)."], ["Which of the following statement is incorrect?", ["hybridization of orbitals involves mixing of atomic orbitals", "C–C bonds in alkynes is shorter than that of alkenes", "the bond angle in sp2 hybridization is 120°", "sp hybrid orbital is less electronegative than sp2 hybrid orbital"], "D", "More s-character makes an orbital more electronegative: sp (50% s) is MORE electronegative than sp² (33% s). D is incorrect."], ["An organic compound A on quantitative analysis contains 52.18% C and 13.04% H. Determine the empirical formula:", ["C2H6O", "C4H10O", "C3H8O", "C5H12O"], "A", "O = 34.78%. Moles: C 52.18/12 = 4.35, H 13.04, O 34.78/16 = 2.17 → 2 : 6 : 1 → C₂H₆O."], ["Ozonolysis of an alkene produced a molecule each of propanal and methanal. The alkene is:", ["1-butene", "1-pentene", "2-pentene", "2-butene"], "A", "Join the C=O carbons: CH₃CH₂CHO + HCHO come from CH₃CH₂CH=CH₂, i.e. but-1-ene."], ["Cyclopropanol is a ___ alcohol?", ["primary", "secondary", "tertiary", "quaternary"], "B", "The OH carbon is bonded to two other carbons in the ring, so it is a secondary alcohol."], ["The following are true of amines EXCEPT:", ["are basic, acidic and neutral", "have lone pair of electrons on their N-atom", "reacts with HCl to produce fumes", "forms salts with acids"], ["A", "C"], "The key gives C, but statement A (“basic, acidic and neutral”) is the clearly false one: amines are bases. Both A and C are accepted here."], ["Which of the following statements is TRUE? (I) ketones form intermolecular hydrogen bonding (II) ketones have lower boiling points than alcohols (III) ketones have lower boiling point than carboxylic acids (IV) ketones have higher boiling point than carboxylic acids", ["I & II", "I & III", "II & III", "IV"], "C", "Ketones cannot H-bond with each other (no O–H), so they boil lower than alcohols and carboxylic acids: II and III."], ["The reaction of butanol with iodopropane will give?", ["dibutyl ether", "dipropyl ether", "butyl propyl ether", "propyl butyl ether"], ["C", "D"], "Williamson-type ether formation gives CH₃CH₂CH₂CH₂–O–CH₂CH₂CH₃. “Butyl propyl ether” and “propyl butyl ether” name the same compound, so C and D are both accepted."], ["All the following are true for an electrophile, except:", ["they are electron deficient", "they are positively charged", "they attack centres of positive charge", "they seek electron rich centres"], "C", "Electrophiles are electron-seeking; they attack electron-rich (negative) centres, not positive ones."], ["The correct order for the nucleophilic attack on the carbonyl C-atom is:", ["propanone > propanal > acetophenone > benzaldehyde", "benzaldehyde > acetophenone > propanone > propanal", "propanal > propanone > benzaldehyde > acetophenone"], "C", "Aldehydes > ketones (less steric hindrance, less electron donation), and aliphatic > aromatic (resonance with the ring lowers reactivity)."], ["Which of the following compounds can exhibit geometrical isomerism?", ["2-hexene", "2-methyl-2-pentene", "1-hexene", "3-methyl-1-pentene"], "A", "CH₃CH=CHCH₂CH₂CH₃: each double-bond carbon carries two different groups, so cis/trans isomers exist."], ["The IUPAC name for CH3CH(OH)CH(Cl)CH2CH2COOH is?", ["2-hydroxy-3-chlorohexanoic acid", "4-chloro-5-hydroxyhexanoic acid", "4-chloro-2-hydroxypentanoic acid", "2-hydroxy-4-chlorohexanoic acid"], "B", "Number from COOH (C1). Cl is on C4 and OH on C5 of a six-carbon chain: 4-chloro-5-hydroxyhexanoic acid."], ["Which of the following statement is incorrect?", ["increase in temperature increases reaction rate", "catalyst will increase the reaction rate by increasing the activation energy", "the rate determining step is the slowest step", "heterolytic fission involves atoms of different electronegativities"], "B", "A catalyst increases rate by LOWERING the activation energy, so B is incorrect."], ["Ethanoic propanoic anhydride reacts with ammonia to form?", ["propylamine and ethanoic acid", "propanamide and ethanoic acid", "propanamide and propanol", "propanamide and ethanoic acid"], ["B", "D"], "Ammonia attacks one carbonyl: one half becomes an amide, the other the acid. B and D are worded identically, so both are accepted."], ["Which of the following compounds could have Z/E isomers?", ["2-methyl-1-butene", "2-methyl-2-butene", "1-chloro-2-methyl-2-butene", "3-chloro-2-methyl-2-butene"], "C", "ClCH₂C(CH₃)=CHCH₃: both double-bond carbons carry two different groups, so Z/E isomers exist."], ["The number of aromatic compounds in the series is:", ["2", "3", "4", "5"], "B", "The structures in this “series” were not included in the paper. The answer key gives 3."], ["The real basis of Markovnikoff’s rule is:", ["stability of the intermediate carbocation", "stability of the product", "stability of the adding compound", "stability of the alkene"], "A", "Markovnikov addition goes through the more stable (more substituted) carbocation intermediate."], ["Determine the molecular formula (Mass 8.2mg, MM 88):", ["C2H4O", "C4H8O2", "C5H12O", "C3H4O3"], "B", "The combustion data are missing from the paper. A molar mass of 88 fits C₄H₈O₂ (88), which is the key's answer."], ["CH3CHO + NH2NH2 → CH3CH=NNH2 + H2O is an example of:", ["Substitution", "Addition", "Rearrangement", "Condensation"], "D", "Two molecules join with loss of water (–H₂O): a condensation (addition–elimination) reaction."], ["Which of the following is not true about Lassaigne’s test?", ["Elements are tested as their inorganic salts", "Na2S, NaCN and NaX are formed", "It can be used to detect the presence of oxygen", "Sulphur can be detected by lead acetate"], "C", "Lassaigne's test detects N, S and halogens. It cannot detect oxygen."], ["The IUPAC name of (CH3)2CHCH2CH2CH(OH)CH2COOH is:", ["5-hydroxy-2-methylheptanoic acid", "1,3-dihydroxy-6-methylheptane", "3-hydroxy-6-methylheptanoic acid", "2-methyl-5-hydroxyheptanoic acid"], "C", "COOH is C1; OH on C3; methyl on C6 of a 7-carbon chain → 3-hydroxy-6-methylheptanoic acid."], ["Identify the false statement:", ["a barrel of crude oil is 180 liters", "gas fraction comprises normal and branched C1-C5 alkanes", "heavy gas oils boil between 305°C and 405°C", "kerosene is used as jet fuel"], "A", "A barrel of crude oil is about 159 litres (42 US gallons), not 180 litres."], ["Which is untrue? Reactions of alkanes with chlorine:", ["goes by chain reaction mechanism", "takes place only at high temperature or sunlight", "produces radicals", "usually gives a high yield of only one product"], "D", "Free-radical chlorination gives a mixture of mono- and polysubstituted products, not one product."], ["Which is incorrect about inductive and mesomeric effects:", ["Effects caused by difference in electronegativity/resonance", "Effects can be transmitted along the chain", "There is no visible shift of electron in mesomeric but there is in inductive", "There is no visible shift of electron in inductive but there is in mesomeric effect"], "C", "Inductive effect is a permanent partial displacement of σ-electrons; mesomeric effect involves complete shift of π-electrons. C reverses this."], ["The chief source of alkene is:", ["petroleum", "by-product from cracking petroleum", "polymers", "coal tar"], "B", "Alkenes are obtained mainly from the cracking of petroleum fractions."], ["Which of the following is incorrect:", ["Greater s-character = greater electronegativity", "Carbon uses sp3 hybrid orbitals for 4 single bonds", "The presence of π bond in ethene makes it less reactive than ethane", "sp hybrid orbitals point at 180°"], "C", "The π-bond makes ethene MORE reactive than ethane (it is electron-rich and easily attacked)."], ["When a double bond is formed, the π-bond is created by the overlap of:", ["s-orbitals", "s and p-orbitals", "f-orbitals", "p-orbitals"], "D", "A π-bond forms by sideways overlap of unhybridised p-orbitals."], ["Homolytic fission of a bond gives:", ["Radicals", "Cations", "Anions", "Radicals and Cations"], "A", "Homolytic fission shares the bond pair equally: each atom keeps one electron → free radicals."], ["Reagents required to transform CH3CH2CH3 into CH3C≡CH are:", ["Cl2 / CCl4 / CH3OH / liq NH3", "C2H5OH / NaOH / NaNH2", "Br2, UV / alcoholic KOH / NaNH2", "Br2 / CCl4 / liq NH3"], "C", "Br₂/UV gives bromopropane… alcoholic KOH eliminates to propene; further bromination and NaNH₂ double elimination give propyne."], ["An alkene on ozonolysis yields propanal and propanone. The compound is:", ["CH3CH2C(CH3)=C(CH3)2", "(CH3)2CHCH=CHCH3", "CH3CH2CH=C(CH3)2", "(CH3)2C=C(CH3)2"], "C", "Join propanal (CH₃CH₂CHO) and propanone ((CH₃)₂CO) at the C=O carbons: CH₃CH₂CH=C(CH₃)₂."], ["C4H6 (1-butyne) + NaNH2 then 1-bromobutane yields:", ["1-butyne", "oct-4-yne", "1-pentyne", "2-pentyne"], "B", "NaNH₂ makes the butynide ion, which substitutes 1-bromobutane: CH₃CH₂C≡C–C₄H₉ (oct-3-yne, strictly). The key gives oct-4-yne."], ["Which of the following is not true:", ["Increase in temperature increases reaction rate", "The rate determining step is the fastest step", "The rate determining step is the slowest step", "Heterolytic fission occurs between different electronegativities"], "B", "The rate-determining step is the SLOWEST step, so B is not true."], ["Which of these is not a nuclear reaction?", ["Fusion", "Decomposition", "Transmutation", "Fission"], "B", "Fusion, fission and transmutation are nuclear reactions; decomposition is a chemical reaction."], ["Element that is not a typical alkaline earth metal because of amphoterism:", ["Mg", "Ba", "Sr", "Be"], "D", "Beryllium oxide and hydroxide are amphoteric, unlike the other Group 2 metals."], ["Which of the following statements is correct about James Chadwick’s contribution to atomic theories in 1932?", ["Discovery of the electron", "Discovery of the proton", "Proposed the planetary model", "Most nuclei also contain a neutral particle called neutrons", "Atoms are indivisible"], "D", "In 1932 Chadwick discovered the neutron, a neutral particle in the nucleus."], ["Which of the following electron configurations is correct for nickel (Z=28)?", ["[Ar] 3d¹⁰", "[Ar] 4s¹ 3d⁹", "[Ar] 4p⁶ 3d⁴", "[Ar] 4s² 3d⁷", "[Ar] 4s² 3d⁸"], "E", "Ni (Z = 28): [Ar] 4s² 3d⁸."], ["When four sp³ hybridized carbon orbitals overlap with four 1s orbitals of hydrogen, the shape of the molecule formed is:", ["Linear", "Trigonal planar", "Tetrahedral", "Octahedral", "Pyramidal"], "C", "Four sp³ orbitals point to the corners of a tetrahedron (CH₄, 109.5°)."], ["What colour will a metal complex show when it absorbs light with wavelength of 600 nm (Orange)?", ["Red", "Orange", "Yellow", "Blue", "Green"], "D", "A complex shows the complementary colour of what it absorbs: absorbing orange (600 nm) → appears blue."], ["Transition metals are so called because they serve as the bridge between the:", ["s- and d-block elements", "p- and d-block elements", "p- and f-block elements", "s- and p-block elements", "Metals and non-metals"], "D", "The d-block sits between the s-block and p-block, bridging them."], ["The spin-only magnetic moment (in BM) of [Co(CO)6]²⁺:", ["5.92", "4.90", "3.87", "2.83", "1.73"], "E", "Co²⁺ is d⁷. CO is a strong-field ligand → low spin, 1 unpaired electron: μ = √(1×3) = 1.73 BM."], ["The sp² hybridized orbitals are oriented at an angle of:", ["180°", "120°", "109.5°", "90°", "60°"], "B", "sp² orbitals are trigonal planar: 120° apart."], ["The more the ___ character in an orbital, the larger the bond angle.", ["p", "s", "d", "f", "Hybrid"], "B", "More s-character → larger bond angle (sp 180° > sp² 120° > sp³ 109.5°)."], ["The more s-character in hybridization:", ["the longer and weaker the bond", "the shorter and stronger the bond", "the bond length remains unchanged", "the bond becomes more ionic", "the bond becomes more coordinate"], "B", "s-orbitals are held closer to the nucleus, so more s-character gives shorter, stronger bonds."], ["The mixing of one s and two p orbitals gives:", ["Two hybrid orbitals", "Three hybrid orbitals", "Four hybrid orbitals", "Five hybrid orbitals", "Six hybrid orbitals"], "B", "One s + two p orbitals → three sp² hybrid orbitals."], ["Method used to remove gangue from sulphide ores:", ["Magnetic separation", "Gravity separation", "Froth floatation method", "Leaching", "Distillation"], "C", "Sulphide ores are concentrated by froth flotation: ore particles are wetted by oil and float."], ["The main ore of aluminium is:", ["Haematite", "Bauxite", "Magnetite", "Cassiterite", "Galena"], "B", "Bauxite (Al₂O₃·2H₂O) is the main ore of aluminium."], ["Group IA elements are stored under paraffin/inert liquid because:", ["They are very expensive", "Highly reactive nature", "To prevent evaporation", "To increase their density", "To make them harder"], "B", "Group 1 metals react with air and moisture, so they are kept under paraffin."], ["Burning ores in a limited or absence of oxygen:", ["Roasting", "Calcination", "Smelting", "Refining", "Electrolysis"], "B", "Heating an ore in limited/no air is calcination (roasting uses excess air)."], ["Decreasing size of Na⁺, N³⁻, Mg²⁺, F⁻ and O²⁻:", ["Mg²⁺ > Na⁺ > F⁻ > O²⁻ > N³⁻", "N³⁻ > O²⁻ > F⁻ > Na⁺ > Mg²⁺", "Na⁺ > Mg²⁺ > F⁻ > O²⁻ > N³⁻", "F⁻ > O²⁻ > N³⁻ > Na⁺ > Mg²⁺", "O²⁻ > N³⁻ > F⁻ > Na⁺ > Mg²⁺"], "B", "All are isoelectronic (10 e⁻). Fewer protons → larger ion: N³⁻ > O²⁻ > F⁻ > Na⁺ > Mg²⁺."], ["Mass defect (in kg) of ¹⁴₆C:", ["1.88 × 10⁻²⁸", "1.55 × 10⁻²⁷", "1.22 × 10⁻²⁶", "1.88 × 10⁻²⁵", "2.11 × 10⁻²⁸"], "A", "6 ¹H + 8 n = 6(1.007825) + 8(1.008665) = 14.11627 u; actual 14.00324 u. Δm = 0.11303 u × 1.6605 × 10⁻²⁷ = 1.88 × 10⁻²⁸ kg."], ["An example of a strong-field ligand is:", ["I⁻", "Cl⁻", "CO", "H₂O", "F⁻"], "C", "CO is a strong-field (π-acceptor) ligand; halides and water are weak-field."], ["All these can be counted as transition metal ions except:", ["Fe²⁺", "Cu²⁺", "Sc³⁺", "Cr³⁺", "Mn²⁺"], "C", "Sc³⁺ has a d⁰ configuration (no partly filled d-orbitals), so it is not counted as a transition-metal ion."], ["C6H12 that does not decolourize Br2/CCl4:", ["1-hexene", "2-hexene", "3-hexene", "cyclohexane", "2-methyl-2-pentene"], "D", "Cyclohexane (C₆H₁₂) has no C=C, so it does not decolourise bromine."], ["The following will undergo Cannizzaro reaction except:", ["Formaldehyde", "Ethanal", "Benzaldehyde", "Trimethylacetaldehyde", "2,2-dimethylpropanal"], "B", "Cannizzaro needs an aldehyde with no α-hydrogen. Ethanal has α-hydrogens."], ["Excess ethanol + conc. H2SO4 at 140°C produces:", ["Ethene", "Diethyl ether", "Ethyl hydrogen sulphate", "Ethane", "Acetaldehyde"], "B", "At 140 °C with excess ethanol, intermolecular dehydration gives diethyl ether (at 170 °C ethene forms)."], ["Which species is NOT a nucleophile?", ["OH⁻", "NH₃", "NO₂⁺", "CN⁻", "H₂O"], "C", "NO₂⁺ (nitronium ion) is an electrophile, not a nucleophile."], ["Property NOT used to detect multiple bonds:", ["Baeyer's reagent", "Molecular mass", "Bromine water", "Ozonolysis", "Catalytic hydrogenation"], "B", "Molecular mass alone does not show C=C or C≡C; the others are tests for unsaturation."], ["Which statement is incorrect?", ["sp³ is tetrahedral", "sp is linear", "sp² is trigonal planar", "sp2 hybrid orbital has linear shape", "sp³d² is octahedral"], "D", "sp² orbitals are trigonal planar; sp is the linear one."], ["Hybrid orbital utilized by carbon in CH4:", ["sp", "sp²", "sp³", "dsp²", "p³"], "C", "Carbon in CH₄ is sp³ hybridised."], ["Soap precipitates in hard water mainly because the:", ["Soap is insoluble in water", "carboxylate group reacts with calcium/magnesium ions", "pH of hard water is too low", "Sodium ions are removed", "Soap is a liquid"], "B", "The carboxylate (RCOO⁻) forms insoluble calcium/magnesium salts (scum)."], ["Reacts with Methyl Magnesium Bromide to give a primary alcohol:", ["Acetaldehyde", "Propanone", "Formaldehyde", "Ethylmethylketone", "Benzaldehyde"], "C", "Grignard + methanal (formaldehyde) → primary alcohol."], ["Which is a primary alcohol?", ["CH3CH2OH", "(CH3)2CHOH", "(CH3)3COH", "CH3CH(OH)CH2CH3", "None of the above"], "A", "CH₃CH₂OH: the OH carbon is attached to only one other carbon → primary."], ["The carbon in α-amino acids is chiral because:", ["it has four different substituents attached to it", "it is bonded to nitrogen", "it has a high molecular mass", "it is in the alpha position", "it forms peptide bonds"], "A", "The α-carbon carries four different groups (H, NH₂, COOH, R), so it is chiral (except glycine)."], ["Carboxylic acids can be prepared by the following except:", ["Oxidation of primary alcohols", "Hydrolysis of nitriles", "Oxidation of secondary alcohols", "Oxidation of aldehydes", "Carbonation of Grignard reagents"], "C", "Oxidising a secondary alcohol gives a ketone, not a carboxylic acid."], ["Distinguish between 2-butanol (2°) and 2-methyl-2-propanol (3°):", ["Baeyer’s reagent", "K2Cr2O7", "Tollens’ reagent", "Fehling's solution", "Bromine water"], "B", "Acidified K₂Cr₂O₇ oxidises the 2° alcohol (orange → green) but not the 3° alcohol."], ["IUPAC name for CH3CH(CH3)CH2CH2CH(CH3)CH(OH)COOH:", ["2-hydroxy-3,6-dimethylheptanoic acid", "3-hydroxy-5-methylheptanoic acid", "2-hydroxy-5-methylhexanoic acid", "6-hydroxy-3,6-dimethylheptanoic acid", "2-hydroxy-3,6-dimethylhexanoic acid"], "A", "COOH is C1, OH on C2, methyls on C3 and C6 of a 7-carbon chain → 2-hydroxy-3,6-dimethylheptanoic acid."], ["Chlorination of ethane catalyst:", ["Iron", "Nickel", "Heat", "Light", "Platinum"], "D", "Free-radical chlorination is initiated by light (UV)."], ["Black precipitate in Lassaigne's sulfur test:", ["PbS", "Ag₂S", "FeS", "CuS", "Na₂S"], "A", "S²⁻ + lead acetate → black PbS."], ["White precipitate soluble in excess NH4OH indicates:", ["chlorine", "bromine", "iodine", "sulfur", "nitrogen"], "A", "AgCl (from chlorine) is white and dissolves in excess NH₄OH."], ["In production of liquid soap, the preferable alkali is:", ["KOH", "NaOH", "LiOH", "Ca(OH)₂", "Mg(OH)₂"], "A", "Potassium soaps are softer and more soluble, so KOH is used for liquid soap."], ["An alkene on ozonolysis yields propanal and propanone:", ["CH3CH2CH=CHCH2CH3", "(CH3)2C=CHCH3", "CH3CH2CH=C(CH3)2", "(CH3)2C=C(CH3)2", "CH3CH=CHCH3"], "C", "Propanal + propanone → CH₃CH₂CH=C(CH₃)₂."], ["Propyne + HgSO4/H2SO4 yields:", ["Propanal", "Propanone", "Propanol", "Propanoic acid", "Propane"], "B", "HgSO₄/H₂SO₄ hydration of propyne follows Markovnikov's rule: the enol tautomerises to propanone."], ["Synthetic detergents are more effective in hard water because:", ["They are cheaper", "their calcium and magnesium salts are water-soluble", "They are more acidic", "They contain bleach", "They are biodegradable"], "B", "Calcium and magnesium salts of detergents are soluble, so no scum forms."], ["Which of these compounds would take part in Friedel–Craft acylation reaction?", ["CH3CH2Cl", "CH3OH", "C6H5COCl", "NH3", "H2O"], "C", "Friedel–Crafts acylation uses an acyl chloride (C₆H₅COCl) with AlCl₃."], ["Hydrolysis of C6H5CN will yield:", ["C6H5CONH2", "C6H5COOH", "C6H5COOCH3", "C6H5CH2OH"], "B", "Complete hydrolysis of a nitrile gives the carboxylic acid: C₆H₅COOH."], ["The reaction of fructose with NaBH4 gives:", ["gluconic acid", "glucitol", "mannitol", "glucitol and mannitol"], "D", "Reducing fructose's C2 ketone creates a new chiral centre, giving both glucitol and mannitol."], ["0.30 g of an organic compound B gave 0.738 g of CO2 and 0.30 g of H2O on combustion. Determine the empirical formula.", ["C2H4O2", "C4H8O3", "C2H6O2", "C4H4O"], "A", "Worked strictly: C = 0.201 g, H = 0.033 g, O = 0.065 g → C₄H₈O, which is not listed. The answer key gives A."], ["Which of the following is incorrect about nucleophiles? They:", ["are negatively charged", "are positively charged", "are electron loving", "attack positive charged centres"], "B", "Nucleophiles are electron-rich (negative or neutral with lone pairs); they are not positively charged."], ["The systematic IUPAC name of (CH3)2N-CH2CH2CH3 is ___ and is a ___ amine.", ["methylethylpropylamine, primary", "ethylmethylpropylamine, secondary", "dimethylpropylamine, tertiary", "propylmethylethylamine, quaternary"], "C", "Nitrogen carries three carbon groups (two methyl, one propyl): N,N-dimethylpropan-1-amine, a tertiary amine."], ["In an anion mechanism of polymer products:", ["the initiator is a nucleophile", "initiator is an acid", "initiator is a radical", "initiator is an alkane"], "A", "Anionic polymerisation is started by a nucleophile (e.g. an organolithium or amide ion)."], ["Carboxylic acids can be regenerated from its sodium salts by reacting it with?", ["NaOH(aq)", "HCl(aq)", "CH3OH", "C2H5OC2H5"], "B", "A strong acid (HCl) protonates the carboxylate: RCOONa + HCl → RCOOH + NaCl."], ["Which of the following compounds would have Z/E isomers?", ["2-methyl-2-butene", "2,3-dimethyl-2-butene", "2,3-dimethyl-1-butene", "3,4-dimethyl-3-hexene"], "D", "CH₃CH₂C(CH₃)=C(CH₃)CH₂CH₃: each double-bond carbon has two different groups."], ["Which of the following is FALSE about alpha-amino acids?", ["they are optically active", "they are amphoteric", "they are acidic", "none of the above"], "D", "α-amino acids are optically active (except glycine), amphoteric, and have an acidic COOH group. None is false."], ["Which of the following is incorrect?", ["Increase in temperature of a reaction will lead to increase in reaction rate", "The rate determining step is the fastest step", "The rate determining step is the slowest step", "Heterolytic fission takes place between atoms of different electronegativities"], "B", "The rate-determining step is the slowest step, so B is incorrect."], ["The appropriate dihalide that will react with H2O / Ba(OH)2 to give butanone is:", ["1,2-dichlorobutane", "2,2-dichlorobutane", "1,3-dichlorobutane", "1,1-dichlorobutane"], "B", "A gem-dihalide on C2 hydrolyses to a ketone at C2: 2,2-dichlorobutane → butanone."], ["One of the following is NOT CORRECT about synthons in organic synthesis:", ["they are associated with polarity", "they are fragments of molecules", "they could be cations or anions", "they are of the same polarity"], "D", "Synthons come in pairs of opposite polarity (donor and acceptor), so D is incorrect."], ["The hydrocarbon end of the soap molecule is ___ and therefore ___?", ["polar, fat loving", "non-polar, water loving", "non-polar, fat loving", "polar, lipophilic"], "C", "The hydrocarbon tail is non-polar and lipophilic (fat-loving)."], ["The amine formed from the following Hofmann reaction CH3CONH2 + Br2 + NaOH → ? is:", ["CH3NH2", "CH3CH2NH2", "CH3CH2CH2NH2", "CH3CH2CH2CH2NH2"], "A", "Hofmann degradation removes one carbon: CH₃CONH₂ → CH₃NH₂."], ["The following are derivatives of carboxylic acids except:", ["alkanamides", "acid chlorides", "esters", "alkanes"], "D", "Amides, acid chlorides and esters are acid derivatives; alkanes are not."], ["The IUPAC name for the compound shown (cyclohexene with Cl on the double bond) is:", ["3-chlorocyclohexene", "1-chlorocyclohexene", "4-chlorocyclohexene", "2-chlorocyclohexene"], "B", "Cl on a double-bond carbon takes position 1: 1-chlorocyclohexene."], ["Highly reactive metals such as sodium and magnesium are obtained by:", ["Roasting of their ores", "Reduction of their oxides with carbon", "Electrolytic reduction of their molten salts", "Reduction using hydrogen"], "C", "Very reactive metals cannot be reduced by carbon; they are obtained by electrolysis of molten salts."], ["During electrolysis of molten sodium chloride, chlorine gas is released at the:", ["Cathode", "Anode", "Both electrodes", "Electrolyte"], "B", "Cl⁻ is oxidised at the anode (positive electrode) to Cl₂."], ["In electrolytic refining, impure metal is used as the:", ["Anode", "Cathode", "Both electrodes", "Electrolyte"], "A", "The impure metal is the anode; pure metal deposits on the cathode."], ["In electrolytic refining, the impurities that settle below the anode are called:", ["Cathode deposit", "Electrolyte residue", "Anode mud", "Slag"], "C", "Insoluble impurities that collect below the anode are called anode mud (anode sludge)."], ["In electrolytic refining of copper, the electrolyte used is:", ["Aqueous copper sulfate", "Aqueous sodium chloride", "Molten copper oxide", "Dilute hydrochloric acid"], "A", "Copper is refined in acidified aqueous copper(II) sulfate."], ["Which gas reduces iron(III) oxide to iron in the blast furnace?", ["Carbon dioxide", "Oxygen", "Carbon monoxide", "Nitrogen"], "C", "Carbon monoxide reduces Fe₂O₃ to Fe in the blast furnace."], ["The role of limestone in the blast furnace is to:", ["Produce heat for the reaction", "Remove acidic impurities as slag", "Act as a reducing agent", "Supply carbon monoxide"], "B", "Limestone decomposes to CaO, which removes acidic impurities (SiO₂) as slag."], ["The substance that forms the molten slag in the blast furnace is:", ["Calcium silicate", "Calcium oxide", "Silicon dioxide", "Calcium carbonate"], "A", "CaO + SiO₂ → CaSiO₃ (calcium silicate) forms the slag."], ["Aluminium cannot be extracted by reduction with carbon because:", ["It is less reactive than carbon", "It is more reactive than carbon", "It does not form oxides", "Carbon is an oxidizing agent"], "B", "Aluminium is above carbon in the reactivity series, so carbon cannot reduce Al₂O₃."], ["The role of cryolite in the extraction of aluminium is to:", ["Supply aluminium ions", "Act as a reducing agent", "Prevent anode wear", "Lower the melting point of aluminium oxide"], "D", "Cryolite lowers the melting point of Al₂O₃ (from ~2050 °C to ~950 °C) and improves conductivity."], ["Which of the following sets of ions is isoelectronic?", ["Na⁺, Mg²⁺, Al³⁺", "O²⁻, F⁻, Ne", "K⁺, Ar, Ca²⁺", "All of the above"], "D", "Each set has the same number of electrons (10, 10 and 18 respectively)."], ["Which of the following statements is TRUE about ionic radii?", ["The ionic radius of Cl⁻ is smaller than that of Cl
